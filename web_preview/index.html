<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GridFlow AI — Apple Liquid Glass (EV Nature Edition)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Apple Light Nature & Sky Blue EV Palette */
      --sky-electric: #00A3FF;
      --sky-vibrant: #0284C7;
      --sky-soft: #38BDF8;
      --sky-mist: #BAE6FD;
      --sky-aura: #E0F2FE;
      
      --nature-emerald: #059669;
      --nature-leaf: #10B981;
      --nature-mint: #D1FAE5;
      --nature-glow: rgba(16, 185, 129, 0.3);
      
      /* Pure Pearl Glass & Crystal Refraction */
      --glass-body: rgba(255, 255, 255, 0.48);
      --glass-card: rgba(255, 255, 255, 0.54);
      --glass-elevated: rgba(255, 255, 255, 0.72);
      --glass-border: rgba(255, 255, 255, 0.88);
      --glass-border-subtle: rgba(255, 255, 255, 0.65);
      --glass-inner-sheen: inset 0 1.5px 2px rgba(255, 255, 255, 0.95), inset 0 -1px 1px rgba(0, 0, 0, 0.03);
      --glass-shadow: 0 18px 40px -10px rgba(15, 23, 42, 0.12), 0 2px 6px rgba(0, 0, 0, 0.04);
      
      /* Typography Colors (High Human Legibility) */
      --text-headline: #0F172A;
      --text-sub: #334155;
      --text-caption: #64748B;
      --text-emerald: #047857;
      --text-sky: #0369A1;
      
      /* Status */
      --amber-busy: #D97706;
      --crimson-emergency: #DC2626;

      /* Extreme Bouncy Spring Physics (Damping ~0.45, Stiffness ~400) */
      --spring-bouncy: cubic-bezier(0.175, 1.45, 0.32, 1.35);
      --spring-dock: cubic-bezier(0.175, 1.45, 0.32, 1.25);
      --macos-zoom: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }

    body {
      min-height: 100vh;
      /* Soft morning daylight presentation studio environment with blurred nature backdrop */
      background: 
        radial-gradient(ellipse at 50% 20%, rgba(186, 230, 253, 0.4) 0%, rgba(224, 242, 254, 0.25) 50%, rgba(241, 245, 249, 0.95) 100%),
        url('assets/ev_nature_backdrop.jpg') center/cover no-repeat fixed;
      position: relative;
      color: var(--text-headline);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    /* Ambient Glass Blur Backdrop Overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(241, 245, 249, 0.82);
      backdrop-filter: blur(55px);
      -webkit-backdrop-filter: blur(55px);
      z-index: 0;
    }

    /* Header Bar */
    .studio-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      z-index: 10;
    }
    .status-capsule {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(24px);
      border: 0.8px solid rgba(255, 255, 255, 1);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      color: var(--sky-vibrant);
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.4px;
    }
    .pulsing-emerald {
      width: 7px;
      height: 7px;
      background: var(--nature-leaf);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--nature-leaf);
      animation: pulseBreath 2s infinite ease-in-out;
    }
    @keyframes pulseBreath {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.35); opacity: 1; box-shadow: 0 0 16px var(--nature-leaf); }
    }

    /* ============================================================
       IPHONE 16 PRO PEARL LIQUID GLASS FRAME
       ============================================================ */
    .iphone-shell {
      position: relative;
      width: 405px;
      height: 844px;
      background: #FFFFFF;
      border-radius: 54px;
      padding: 10px;
      box-shadow: 
        0 40px 90px -20px rgba(15, 23, 42, 0.28),
        0 0 0 1px rgba(255, 255, 255, 1),
        0 0 45px rgba(0, 163, 255, 0.12),
        inset 0 1px 2px rgba(255, 255, 255, 0.95);
      z-index: 10;
      display: flex;
      flex-direction: column;
    }
    
    /* PHONE SCREEN SURFACE */
    .screen-surface {
      position: relative;
      flex: 1;
      background-image: 
        linear-gradient(180deg, 
          rgba(224, 242, 254, 0.32) 0%, 
          rgba(248, 250, 252, 0.42) 45%, 
          rgba(209, 250, 229, 0.36) 100%
        ),
        url('assets/ev_nature_backdrop.jpg');
      background-size: cover;
      background-position: center top;
      border-radius: 44px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.8);
    }

    /* CLEAN MINIMAL STATUS BAR */
    .status-row {
      height: 38px;
      padding: 12px 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-headline);
      z-index: 50;
    }
    .status-network {
      display: flex;
      gap: 6px;
      align-items: center;
      color: var(--text-headline);
    }
    .network-badge {
      font-size: 10px;
      font-weight: 800;
      color: var(--sky-vibrant);
    }

    /* CLEAN APP NAV HEADER (NO DEMO BUTTON) */
    .app-header {
      padding: 8px 20px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
    }
    .brand-group h2 {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-headline);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-group p {
      font-size: 10.5px;
      color: var(--sky-vibrant);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-top: 1px;
    }
    .header-live-badge {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      border: 0.8px solid rgba(255, 255, 255, 1);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 9.5px;
      font-weight: 800;
      color: var(--nature-emerald);
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    /* SCROLLABLE VIEWPORT (Balanced, Equal Spacing Without Bottom Crowding) */
    .scroll-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 6px 18px 94px; /* 94px clearance ensures dock never overlaps content */
      display: flex;
      flex-direction: column;
      scroll-behavior: smooth;
    }
    .scroll-body::-webkit-scrollbar { width: 0; }

    /* UNIFIED SCREEN VIEW CONTENT WRAPPER */
    .view-content {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      animation: macosWindowIn 0.35s var(--macos-zoom);
    }
    @keyframes macosWindowIn {
      0% { opacity: 0; transform: scale(0.96) translateY(8px); filter: blur(4px); }
      100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
    }

    /* AUTHENTIC APPLE LIQUID GLASS FLOATING PANELS */
    .glass-panel {
      position: relative;
      background: var(--glass-card);
      backdrop-filter: blur(30px) saturate(210%);
      -webkit-backdrop-filter: blur(30px) saturate(210%);
      border-radius: 24px;
      padding: 16px 18px;
      border: 0.8px solid var(--glass-border);
      box-shadow: var(--glass-shadow), var(--glass-inner-sheen);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      overflow: hidden;
      width: 100%;
    }
    .glass-panel:hover {
      transform: translateY(-2px);
      background: var(--glass-elevated);
      border-color: #FFFFFF;
      box-shadow: 0 20px 48px -10px rgba(15, 23, 42, 0.15), var(--glass-inner-sheen);
    }
    /* Sunlight Specular Refraction Sheen */
    .glass-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 45%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.12) 60%, transparent 100%);
      pointer-events: none;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
    }

    /* TYPOGRAPHY STANDARDS (Apple HIG Clean Minimal Standard) */
    .view-title {
      font-size: 16.5px;
      font-weight: 800;
      color: var(--text-headline);
      letter-spacing: -0.4px;
      margin-bottom: 1px;
    }
    .view-caption {
      font-size: 11.5px;
      color: var(--text-caption);
      line-height: 1.35;
    }

    /* HIGH IMPACT METRIC TAGS */
    .hero-stat-tag {
      font-size: 10px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .tag-sky {
      background: var(--sky-aura);
      color: var(--sky-vibrant);
      border: 0.5px solid rgba(2, 132, 199, 0.3);
    }
    .tag-emerald {
      background: var(--nature-mint);
      color: var(--nature-emerald);
      border: 0.5px solid rgba(16, 185, 129, 0.3);
    }
    .tag-crimson {
      background: #FEE2E2;
      color: var(--crimson-emergency);
      border: 0.5px solid rgba(239, 68, 68, 0.3);
    }

    /* TACTILE SPRING BUTTONS */
    .spring-tactile-btn {
      position: relative;
      background: linear-gradient(135deg, #00A3FF 0%, #0284C7 45%, #10B981 100%);
      color: #FFFFFF;
      border: none;
      padding: 13.5px 20px;
      border-radius: 17px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: -0.2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 
        0 10px 25px -4px rgba(0, 163, 255, 0.45),
        0 0 14px rgba(16, 185, 129, 0.25),
        inset 0 1.5px 2px rgba(255, 255, 255, 0.6);
      transition: transform 0.35s var(--spring-bouncy), box-shadow 0.25s ease;
      user-select: none;
    }
    .spring-tactile-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 14px 32px -4px rgba(0, 163, 255, 0.6), 0 0 20px rgba(16, 185, 129, 0.35);
    }
    .spring-tactile-btn:active {
      transform: translateY(2px) scale(0.92);
      box-shadow: 0 4px 10px rgba(0, 163, 255, 0.3);
    }

    /* LIQUID MORPHING SLIDER (Hardware-Accelerated, Zero-Flicker) */
    .slider-container {
      margin: 10px 0 4px;
      position: relative;
    }
    .slider-sunlit-track {
      width: 100%;
      height: 10px;
      background: rgba(226, 232, 240, 0.7);
      border-radius: 999px;
      position: relative;
      overflow: hidden;
      border: 0.5px solid rgba(255, 255, 255, 0.9);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.06);
    }
    .slider-fluid-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      background: linear-gradient(90deg, #0284C7 0%, #00A3FF 60%, #10B981 100%);
      border-radius: 999px;
      box-shadow: 0 0 12px rgba(0, 163, 255, 0.4);
      transition: width 0.04s linear;
    }
    .slider-input-overlay {
      position: absolute;
      top: -7px; left: 0;
      width: 100%;
      height: 24px;
      opacity: 0;
      cursor: pointer;
      z-index: 10;
    }
    .slider-lens-thumb {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 24px;
      height: 24px;
      background: #FFFFFF;
      border-radius: 50%;
      box-shadow: 0 3px 12px rgba(15, 23, 42, 0.18), 0 0 14px var(--sky-electric);
      pointer-events: none;
      transition: left 0.04s linear, transform 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.95);
    }

    /* ============================================================
       MAC OS / IOS FLOATING LIQUID GLASS CAPSULE DOCK
       ============================================================ */
    .floating-mac-dock {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 334px;
      height: 58px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(36px) saturate(220%);
      -webkit-backdrop-filter: blur(36px) saturate(220%);
      border-radius: 29px;
      border: 0.8px solid rgba(255, 255, 255, 0.95);
      box-shadow: 
        0 20px 44px -8px rgba(15, 23, 42, 0.18),
        inset 0 1.5px 2px rgba(255, 255, 255, 1),
        inset 0 -1px 1px rgba(0, 0, 0, 0.04);
      display: flex;
      align-items: center;
      padding: 5px;
      z-index: 40;
    }
    /* Gliding Liquid Refractive Bubble Lens */
    .dock-glide-bubble {
      position: absolute;
      height: 48px;
      width: 108px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98) 0%, rgba(240, 249, 255, 0.92) 100%);
      border-radius: 24px;
      border: 0.8px solid rgba(255, 255, 255, 1);
      box-shadow: 
        0 10px 24px rgba(0, 163, 255, 0.28),
        inset 2.5px 0 5px rgba(0, 163, 255, 0.5),
        inset -2.5px 0 5px rgba(16, 185, 129, 0.5),
        inset 0 2px 4px rgba(255, 255, 255, 1),
        inset 0 -2px 4px rgba(251, 191, 36, 0.25);
      top: 5px;
      left: 5px;
      pointer-events: none;
      transition: transform 0.42s var(--spring-dock);
      z-index: 1;
    }
    .dock-tab {
      position: relative;
      z-index: 2;
      background: none;
      border: none;
      width: 108px;
      height: 48px;
      color: var(--text-caption);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      transition: transform 0.35s var(--spring-bouncy), color 0.2s ease;
      user-select: none;
    }
    .dock-tab.active {
      color: var(--sky-vibrant);
      transform: scale(1.14);
      text-shadow: 0 0 14px rgba(0, 163, 255, 0.45);
    }
    .dock-icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    .dock-tab.active .dock-icon {
      transform: translateY(-1px);
    }

    /* SCREEN 2: V2V P2P LIQUID DIALS */
    .v2v-nature-stage {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 2px;
    }
    .car-orb {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 105px;
    }
    .orb-ring {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
      box-shadow: 0 10px 22px rgba(0, 163, 255, 0.15);
      position: relative;
    }
    .orb-center {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 800;
      color: var(--text-headline);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }
    .orb-model { font-size: 12px; font-weight: 800; color: var(--text-headline); }
    .orb-sub { font-size: 10px; color: var(--text-caption); margin-top: 1px; }

    /* Animated Nature Energy Beam */
    .beam-sunlit-conduit {
      flex: 1;
      height: 6px;
      background: rgba(226, 232, 240, 0.6);
      border-radius: 999px;
      margin: 0 10px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
    }
    .beam-stream {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 50%;
      background: linear-gradient(90deg, transparent, #00A3FF, #10B981, transparent);
      box-shadow: 0 0 14px #00A3FF;
      animation: streamFlow 1.1s linear infinite;
    }
    @keyframes streamFlow {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    /* SCREEN 3: REALISTIC VECTOR MINI-MAP */
    .map-vector-wrapper {
      position: relative;
      height: 245px;
      background: #EBF4FC;
      border-radius: 22px;
      overflow: hidden;
      border: 0.8px solid var(--glass-border);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08), inset 0 0 20px rgba(0, 163, 255, 0.06);
    }
    .map-vector-svg {
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    /* User GPS Location Puck */
    .user-gps-puck {
      position: absolute;
      transform: translate(-50%, -50%);
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }
    .gps-pulse {
      position: absolute;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(0, 163, 255, 0.22);
      animation: gpsPulseAnim 2.2s infinite ease-out;
    }
    .gps-dot {
      width: 13px;
      height: 13px;
      background: var(--sky-electric);
      border: 2.5px solid #FFFFFF;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0, 163, 255, 0.6);
      position: relative;
      z-index: 2;
    }
    .gps-badge {
      background: rgba(15, 23, 42, 0.85);
      color: #FFFFFF;
      font-size: 8px;
      font-weight: 800;
      padding: 1.5px 5px;
      border-radius: 5px;
      margin-top: 2px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      white-space: nowrap;
    }
    @keyframes gpsPulseAnim {
      0% { transform: scale(0.6); opacity: 0.9; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    /* Interactive Station Map Pins */
    .map-station-pill {
      position: absolute;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(14px);
      border: 0.8px solid rgba(255, 255, 255, 1);
      border-radius: 11px;
      padding: 5px 9px;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.12);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 30;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      user-select: none;
    }
    .map-station-pill:hover {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.18);
    }
    .map-station-pill.active {
      border-color: var(--sky-electric);
      background: #FFFFFF;
      box-shadow: 0 8px 22px rgba(0, 163, 255, 0.35);
      transform: scale(1.05);
    }
    .pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .pill-dot.emerald {
      background: var(--nature-leaf);
      box-shadow: 0 0 8px var(--nature-leaf);
    }
    .pill-dot.crimson {
      background: var(--crimson-emergency);
      box-shadow: 0 0 8px var(--crimson-emergency);
    }
    .pill-content {
      display: flex;
      flex-direction: column;
    }
    .pill-title {
      font-size: 9.5px;
      font-weight: 800;
      color: var(--text-headline);
      white-space: nowrap;
    }
    .pill-meta {
      font-size: 8px;
      color: var(--text-caption);
      font-weight: 700;
      white-space: nowrap;
    }

    /* 15-Minute Slot Chips */
    .slot-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin: 8px 0 12px;
    }
    .slot-card {
      background: rgba(255, 255, 255, 0.72);
      border: 0.8px solid rgba(255, 255, 255, 1);
      border-radius: 13px;
      padding: 8px 4px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .slot-card.selected {
      background: linear-gradient(135deg, #00A3FF 0%, #10B981 100%);
      color: #FFF;
      box-shadow: 0 6px 18px rgba(0, 163, 255, 0.4);
      transform: scale(1.04);
    }
    .slot-card .time { font-size: 12.5px; font-weight: 800; }
    .slot-card .sub { font-size: 8.5px; opacity: 0.85; margin-top: 1px; }

    /* APPLE WALLET DIGITAL PASS MODAL */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      animation: modalZoomIn 0.3s var(--macos-zoom);
    }
    @keyframes modalZoomIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }
    .pass-ticket {
      width: 100%;
      background: #FFFFFF;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 1);
      box-shadow: 0 35px 70px -15px rgba(15, 23, 42, 0.28);
      padding: 22px;
      position: relative;
    }
  </style>
</head>
<body>

  <div class="studio-header">
    <div class="status-capsule">
      <div class="pulsing-emerald"></div>

  <!-- IPHONE 16 PRO FRAME -->
  <div class="iphone-shell">
    <div class="screen-surface">
      
      <!-- CLEAN STATUS BAR -->
      <div class="status-row">

        <div class="status-network">

          <svg width="18" height="11" viewBox="0 0 24 14" fill="currentColor">
            <rect x="1" y="1" width="19" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
            <rect x="3" y="3" width="13" height="8" rx="1.5"/>
            <path d="M22 5v4"/>
          </svg>
        </div>
      </div>

      <!-- APP HEADER (Clean, No Demo Button) -->
      <div class="app-header">
        <div class="brand-group">
          <h2>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--sky-vibrant)"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            GridFlow AI

        <div class="header-live-badge">

      <!-- SCROLLABLE VIEWPORT -->
      <div class="scroll-body" id="scrollContainer">
        <!-- Rendered reactively by active screen controller -->
      </div>

      <!-- MAC OS / IOS FLOATING LIQUID GLASS CAPSULE DOCK -->
      <div class="floating-mac-dock">
        <!-- Gliding Liquid Refractive Bubble Lens -->
        <div class="dock-glide-bubble" id="dockBubble"></div>

        <button class="dock-tab active" onclick="switchDockTab(0)">
          <svg class="dock-icon" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>

        </button>
        <button class="dock-tab" onclick="switchDockTab(1)">
          <svg class="dock-icon" viewBox="0 0 24 24"><path d="M16 17.01V10h-2v7.01h-3L15 21l4-3.99h-3zM9 3L5 6.99h3V14h2V6.99h3L9 3z"/></svg>
          V2V Hub
        </button>
        <button class="dock-tab" onclick="switchDockTab(2)">
          <svg class="dock-icon" viewBox="0 0 24 24"><path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/></svg>
          Live Map

      <!-- APPLE WALLET DIGITAL PASS MODAL -->
      <div class="modal-backdrop" id="passBackdrop">
        <div class="pass-ticket">

            <span style="font-size: 11px; font-weight: 700; color: var(--text-caption);" id="ticketIdLabel">GF-8841</span>
          </div>

          <div style="margin: 14px 0;">
            <div style="font-size: 18px; font-weight: 800; color: var(--text-headline);" id="ticketStationName">Indiranagar 100ft Hub</div>
            <div style="font-size: 11.5px; color: var(--text-caption);" id="ticketStationAddress">100 Feet Rd, HAL 2nd Stage</div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: rgba(248, 250, 252, 0.9); border-radius: 15px; padding: 12px; margin-bottom: 14px; border: 0.5px solid #E2E8F0;">
            <div>
              <span style="font-size: 8.5px; color: var(--text-caption); display: block; font-weight: 700;">ALLOCATED BAY</span>
              <strong style="font-size: 12.5px; color: var(--nature-emerald);" id="ticketBayLabel">Bay #1 (120 kW Fast)</strong>
            </div>
            <div>
              <span style="font-size: 8.5px; color: var(--text-caption); display: block; font-weight: 700;">STATUS</span>
              <strong style="font-size: 12.5px; color: var(--text-headline);" id="ticketPriorityLabel">CONFIRMED (15 MIN)</strong>
            </div>
          </div>

          <!-- Digital Barcode Sheen -->
          <div style="background: #F1F5F9; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; align-items: center;">
            <svg width="200" height="40" viewBox="0 0 200 40" fill="#0F172A">
              <rect x="0" y="0" width="4" height="40"/><rect x="8" y="0" width="2" height="40"/><rect x="14" y="0" width="6" height="40"/><rect x="24" y="0" width="3" height="40"/><rect x="32" y="0" width="5" height="40"/><rect x="42" y="0" width="2" height="40"/><rect x="48" y="0" width="8" height="40"/><rect x="60" y="0" width="3" height="40"/><rect x="68" y="0" width="6" height="40"/><rect x="78" y="0" width="2" height="40"/><rect x="84" y="0" width="7" height="40"/><rect x="96" y="0" width="4" height="40"/><rect x="104" y="0" width="2" height="40"/><rect x="110" y="0" width="8" height="40"/><rect x="122" y="0" width="3" height="40"/><rect x="130" y="0" width="6" height="40"/><rect x="140" y="0" width="5" height="40"/><rect x="150" y="0" width="2" height="40"/><rect x="156" y="0" width="7" height="40"/><rect x="168" y="0" width="3" height="40"/><rect x="176" y="0" width="6" height="40"/><rect x="186" y="0" width="4" height="40"/><rect x="194" y="0" width="3" height="40"/>
            </svg>
            <span style="font-size: 8.5px; font-weight: 800; color: var(--text-caption); letter-spacing: 2px; margin-top: 4px;">HOLD NEAR NFC CHARGER TERMINAL</span>
          </div>

          <button class="spring-tactile-btn" style="width: 100%; margin-top: 16px;" onclick="closeTicketModal()">
            DONE & LOCK TO WALLET
          </button>
        </div>
      </div>

    </div>
  </div>

  <script>
    const API_BASE = "http://127.0.0.1:8000";

    // Reactive State
    const state = {
      activeTab: 0,
      userBattery: 28,
      vehicleModel: "Tata Nexon EV Max",
      vehicleType: "Sedan",
      v2vTransferKwh: 10,

      donorModel: "Hyundai Ioniq 5",
      donorBattery: 92,
      donorDistanceKm: 0.4,

      gridCapacity: 98,
      selectedStation: null,
      selectedSlot: "18:45",

      stations: [
        { id: 1, name: "Indiranagar 100ft Hub", address: "100 Feet Rd, HAL 2nd Stage", chargers_total: 8, chargers_available: 3, power_kw: 120, grid_load: 0.65, predicted_wait_min: 8.5, price_per_kwh: 15.5, distance_km: 2.4, queue_length: 2 },
        { id: 2, name: "Koramangala FastCharge", address: "Hosur Rd, 7th Block", chargers_total: 6, chargers_available: 4, power_kw: 60, grid_load: 0.45, predicted_wait_min: 4.2, price_per_kwh: 14.0, distance_km: 3.8, queue_length: 1 },
        { id: 3, name: "MG Road Metro Super Hub", address: "Trinity Circle, MG Road", chargers_total: 4, chargers_available: 0, power_kw: 150, grid_load: 0.88, predicted_wait_min: 24.5, price_per_kwh: 17.0, distance_km: 1.2, queue_length: 4 },
        { id: 4, name: "Whitefield ITPL PowerPort", address: "ITPL Main Rd, Whitefield", chargers_total: 10, chargers_available: 5, power_kw: 120, grid_load: 0.52, predicted_wait_min: 7.0, price_per_kwh: 14.5, distance_km: 8.5, queue_length: 2 }
      ]
    };

    function init() {
      state.selectedStation = state.stations[0];
      updateClock();
      setInterval(updateClock, 1000);
      renderView();

      // Fetch live stations from backend if online
      fetch(`${API_BASE}/stations`)
        .then(res => res.json())
        .then(data => {
          if (data && data.stations && data.stations.length > 0) {
            state.stations = data.stations.slice(0, 4).map((s, idx) => ({
              ...s,
              distance_km: (2.4 + idx * 1.5).toFixed(1),
              queue_length: s.queue_length !== undefined ? s.queue_length : (idx === 2 ? 4 : idx + 1)
            }));
            // Update selected station reference if present
            state.selectedStation = state.stations[0];
            if (state.activeTab === 2) renderScreen3(document.getElementById('scrollContainer'));
          }
        })
        .catch(() => {});
    }

    function updateClock() {
      const now = new Date();
      const hrs = now.getHours().toString().padStart(2, '0');
      const mins = now.getMinutes().toString().padStart(2, '0');
      document.getElementById('timeClock').innerText = `${hrs}:${mins}`;
    }

    function switchDockTab(idx) {
      if (state.activeTab === idx) return;
      state.activeTab = idx;
      
      // Pixel-perfect centering: exactly 108px per tab
      const bubble = document.getElementById('dockBubble');
      bubble.style.transform = `translateX(${idx * 108}px)`;

      document.querySelectorAll('.dock-tab').forEach((tab, i) => {
        if (i === idx) tab.classList.add('active');
        else tab.classList.remove('active');
      });

      renderView();
    }

    function isUrgent() {
      return state.vehicleType.toLowerCase() === "ambulance" || state.userBattery <= 10;
    }

    /* -------------------------------------------------------------
       SCREEN RENDERERS (Balanced Spacing, Clean Typography)
       ------------------------------------------------------------- */
    function renderView() {
      const body = document.getElementById('scrollContainer');
      document.getElementById('vehicleSubtext').innerText = `${state.vehicleModel.toUpperCase()} (${state.userBattery}%)`;

      if (state.activeTab === 0) renderScreen1(body);
      else if (state.activeTab === 1) renderScreen2(body);
      else if (state.activeTab === 2) renderScreen3(body);
    }

    /* ============================================================
       SCREEN 1: AI GRID & CHARGER MATCHER
       ============================================================ */
    function renderScreen1(body) {
      const urgent = isUrgent();
      const topMatch = state.stations[0];

      body.innerHTML = `
        <div class="view-content">
          <!-- TITLE -->
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <div>
              <div class="view-title">Smart Charging</div>
              <div class="view-caption">Real-time grid match & queue predictions</div>
            </div>
            <span id="screen1HeaderTag" class="hero-stat-tag ${urgent ? 'tag-crimson' : 'tag-sky'}">
              ${urgent ? 'PRIORITY LEAPFROG' : 'OPTIMAL GRID'}
            </span>
          </div>

          <!-- CARD 1: GRID CAPACITY -->
          <div class="glass-panel">
            <div style="display: flex; justify-content: space-between; align-items: baseline;">
              <div>
                <span style="font-size: 10.5px; font-weight: 800; color: var(--text-caption); text-transform: uppercase; letter-spacing: 0.5px;">
                  Grid Capacity
                </span>
                <div style="font-size: 28px; font-weight: 800; color: var(--sky-vibrant); font-family: 'JetBrains Mono', monospace; margin-top: 3px;">
                  ${state.gridCapacity}%
                </div>
              </div>
              <span class="hero-stat-tag tag-emerald">STABLE & GREEN</span>
            </div>
            
            <div style="width: 100%; height: 6px; background: rgba(226, 232, 240, 0.6); border-radius: 999px; margin-top: 10px; overflow: hidden;">
              <div style="width: ${state.gridCapacity}%; height: 100%; background: linear-gradient(90deg, #0284C7, #10B981); border-radius: 999px;"></div>
            </div>
          </div>

          <!-- CARD 2: VEHICLE BATTERY SLIDER -->
          <div class="glass-panel">
            <div style="display: flex; justify-content: space-between; align-items: baseline;">
              <div>
                <div style="font-size: 13.5px; font-weight: 800; color: var(--text-headline);">Vehicle Battery</div>
                <div style="font-size: 11px; color: var(--text-caption);">Slide to simulate critical battery preemption</div>
              </div>
              <span id="batteryPctDisplay" style="font-size: 22px; font-weight: 800; color: ${urgent ? 'var(--crimson-emergency)' : 'var(--sky-vibrant)'}; font-family: 'JetBrains Mono', monospace;">
                ${state.userBattery}%
              </span>
            </div>

            <div class="slider-container">
              <div class="slider-sunlit-track">
                <div id="batteryFillTrack" class="slider-fluid-fill" style="width: ${state.userBattery}%; background: ${urgent ? 'linear-gradient(90deg, #DC2626, #EF4444)' : 'linear-gradient(90deg, #0284C7 0%, #00A3FF 60%, #10B981 100%)'};"></div>
              </div>
              <input type="range" min="4" max="100" value="${state.userBattery}" class="slider-input-overlay" oninput="updateBatterySlider(this.value)">
              <div class="slider-lens-thumb" id="batteryThumb" style="left: ${state.userBattery}%;"></div>
            </div>

            <div id="emergencyAlertBanner" style="display: ${urgent ? 'flex' : 'none'}; background: rgba(254, 226, 226, 0.95); border-radius: 12px; padding: 9px 12px; margin-top: 10px; gap: 8px; align-items: center; border: 0.5px solid #FCA5A5;">
              <span style="font-size: 14px;">🚨</span>
              <span style="font-size: 11px; font-weight: 800; color: #991B1B;">
                Critical battery (&le;10%). Leapfrog preemption applied for Bay #1.
              </span>
            </div>
          </div>

          <!-- CARD 3: RECOMMENDED CHARGER -->
          <div class="glass-panel" style="background: linear-gradient(175deg, rgba(255,255,255,0.78) 0%, rgba(224,242,254,0.65) 100%); border-color: rgba(0,163,255,0.45);">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
              <div>
                <span id="recommendMatchTag" class="hero-stat-tag ${urgent ? 'tag-crimson' : 'tag-sky'}" style="font-size: 9px;">
                  ${urgent ? '🚨 EMERGENCY DISPATCH' : '✨ OPTIMAL MATCH'}
                </span>
                <div style="font-size: 17px; font-weight: 800; color: var(--text-headline); margin-top: 5px;">${topMatch.name}</div>
                <div style="font-size: 11.5px; color: var(--text-caption);">${topMatch.address}</div>
              </div>
              <div id="recScoreBadge" style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 800; color: var(--sky-vibrant); background: var(--sky-aura); padding: 4px 8px; border-radius: 8px; border: 0.5px solid rgba(2, 132, 199, 0.25);">
                ${urgent ? '99/100' : '96/100'}
              </div>
            </div>

            <!-- 3 Clean Metrics (Apple Standard) -->
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(12px); padding: 11px; border-radius: 15px; border: 0.5px solid rgba(255, 255, 255, 1);">
              <div>
                <span style="font-size: 8.5px; color: var(--text-caption); display: block; font-weight: 700;">WAIT TIME</span>
                <strong id="recWaitTimeVal" style="font-size: 13.5px; color: ${urgent ? 'var(--crimson-emergency)' : 'var(--sky-vibrant)'}; font-family: 'JetBrains Mono', monospace;">
                  ~${urgent ? '0' : topMatch.predicted_wait_min} min
                </strong>
              </div>
              <div>
                <span style="font-size: 8.5px; color: var(--text-caption); display: block; font-weight: 700;">DISTANCE</span>
                <strong style="font-size: 13.5px; font-family: 'JetBrains Mono', monospace;">${topMatch.distance_km} km</strong>
              </div>
              <div>
                <span style="font-size: 8.5px; color: var(--text-caption); display: block; font-weight: 700;">PRICE</span>
                <strong style="font-size: 13.5px; font-family: 'JetBrains Mono', monospace;">₹${topMatch.price_per_kwh}/kWh</strong>
              </div>
            </div>

            <button id="recActionBtn" class="spring-tactile-btn" style="width: 100%;" onclick="openReservationModal(${topMatch.id})">
              ${urgent ? 'DISPATCH EMERGENCY BAY #1' : 'RESERVE 15-MIN BAY'}
            </button>
          </div>
        </div>
      `;
    }

    /* ZERO-FLICKER REAL-TIME BATTERY SLIDER UPDATE */
    function updateBatterySlider(val) {
      state.userBattery = parseInt(val);
      const urgent = isUrgent();

      // 1. Direct label update
      const pctDisplay = document.getElementById('batteryPctDisplay');
      if (pctDisplay) {
        pctDisplay.innerText = val + '%';
        pctDisplay.style.color = urgent ? 'var(--crimson-emergency)' : 'var(--sky-vibrant)';
      }

      // Header vehicle subtext
      const vSub = document.getElementById('vehicleSubtext');
      if (vSub) {
        vSub.innerText = `${state.vehicleModel.toUpperCase()} (${val}%)`;
      }

      // 2. Track fill & thumb
      const fill = document.getElementById('batteryFillTrack');
      if (fill) {
        fill.style.width = val + '%';
        fill.style.background = urgent 
          ? 'linear-gradient(90deg, #DC2626, #EF4444)' 
          : 'linear-gradient(90deg, #0284C7 0%, #00A3FF 60%, #10B981 100%)';
      }

      const thumb = document.getElementById('batteryThumb');
      if (thumb) {
        thumb.style.left = val + '%';
      }

      // 3. Emergency alert banner
      const banner = document.getElementById('emergencyAlertBanner');
      if (banner) {
        banner.style.display = urgent ? 'flex' : 'none';
      }

      // 4. Header status tags & button
      const hTag = document.getElementById('screen1HeaderTag');
      if (hTag) {
        hTag.innerText = urgent ? 'PRIORITY LEAPFROG' : 'OPTIMAL GRID';
        hTag.className = `hero-stat-tag ${urgent ? 'tag-crimson' : 'tag-sky'}`;
      }

      const mTag = document.getElementById('recommendMatchTag');
      if (mTag) {
        mTag.innerText = urgent ? '🚨 EMERGENCY DISPATCH' : '✨ OPTIMAL MATCH';
        mTag.className = `hero-stat-tag ${urgent ? 'tag-crimson' : 'tag-sky'}`;
      }

      const waitEl = document.getElementById('recWaitTimeVal');
      if (waitEl) {
        waitEl.innerText = urgent ? '~0 min' : `~${state.stations[0].predicted_wait_min} min`;
        waitEl.style.color = urgent ? 'var(--crimson-emergency)' : 'var(--sky-vibrant)';
      }

      const scoreEl = document.getElementById('recScoreBadge');
      if (scoreEl) {
        scoreEl.innerText = urgent ? '99/100' : '96/100';
      }

      const btn = document.getElementById('recActionBtn');
      if (btn) {
        btn.innerText = urgent ? 'DISPATCH EMERGENCY BAY #1' : 'RESERVE 15-MIN BAY';
      }
    }

    /* ============================================================
       SCREEN 2: V2V P2P ENERGY SHARING HUB
       ============================================================ */
    function renderScreen2(body) {
      const kwh = state.v2vTransferKwh;
      const donorSoc = Math.max(15, Math.round(state.donorBattery - (kwh / 72.6 * 100)));
      const receiverSoc = Math.min(100, Math.round(state.userBattery + (kwh / 40.5 * 100)));
      const durationMin = Math.round((kwh / 22.0) * 60);
      const ecoCredits = kwh * 15;

      body.innerHTML = `
        <div class="view-content">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <div>
              <div class="view-title">V2V Energy Sharing</div>
              <div class="view-caption">Peer-to-peer mobile power transfer</div>
            </div>
            <span class="hero-stat-tag tag-sky">P2P LINK READY</span>
          </div>

          <!-- CAR-TO-CAR STAGE -->
          <div class="glass-panel">
            <div class="v2v-nature-stage">
              <!-- DONOR -->
              <div class="car-orb">
                <div class="orb-ring" style="background: conic-gradient(var(--sky-vibrant) ${donorSoc}%, #E2E8F0 0);">
                  <div class="orb-center" id="donorSocVal">${donorSoc}%</div>
                </div>
                <div class="orb-model">Ioniq 5</div>
                <div class="orb-sub">Peer Donor</div>
              </div>

              <!-- SUNLIT ENERGY BEAM -->
              <div class="beam-sunlit-conduit">
                <div class="beam-stream"></div>
              </div>

              <!-- RECEIVER -->
              <div class="car-orb">
                <div class="orb-ring" style="background: conic-gradient(#10B981 ${receiverSoc}%, #E2E8F0 0);">
                  <div class="orb-center" id="receiverSocVal" style="color: var(--nature-emerald);">${receiverSoc}%</div>
                </div>
                <div class="orb-model">Nexon EV</div>
                <div class="orb-sub">Your Car</div>
              </div>
            </div>

            <div style="display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-sub); border-top: 1px solid rgba(241, 245, 249, 0.8); padding-top: 10px; margin-top: 4px;">
              <span>Distance: <strong style="color: var(--text-headline);">${state.donorDistanceKm} km away</strong></span>
              <span>Rate: <strong style="color: var(--sky-vibrant);">22 kW DC Fast</strong></span>
            </div>
          </div>

          <!-- KWH SLIDER PANEL -->
          <div class="glass-panel">
            <div style="display: flex; justify-content: space-between; align-items: baseline;">
              <span style="font-size: 13.5px; font-weight: 800;">Transfer Energy</span>
              <span style="font-size: 22px; font-weight: 800; color: var(--sky-vibrant); font-family: 'JetBrains Mono', monospace;" id="kwhLabel">
                ${kwh} kWh
              </span>
            </div>

            <div class="slider-container">
              <div class="slider-sunlit-track">
                <div class="slider-fluid-fill" id="v2vFill" style="width: ${(kwh / 25) * 100}%;"></div>
              </div>
              <input type="range" min="3" max="25" value="${kwh}" class="slider-input-overlay" oninput="updateV2VSlider(this.value)">
              <div class="slider-lens-thumb" id="v2vThumb" style="left: ${(kwh / 25) * 100}%;"></div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 14px;">
              <div style="background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); padding: 10px; border-radius: 14px; border: 0.5px solid rgba(255,255,255,1);">
                <span style="font-size: 8.5px; color: var(--text-caption); display: block; font-weight: 700;">DURATION</span>
                <strong id="v2vDurationVal" style="font-size: 13.5px; font-family: 'JetBrains Mono', monospace;">~${durationMin} min</strong>
              </div>
              <div style="background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); padding: 10px; border-radius: 14px; border: 0.5px solid rgba(255,255,255,1);">
                <span style="font-size: 8.5px; color: var(--text-caption); display: block; font-weight: 700;">ECOREWARD</span>
                <strong id="v2vEcoVal" style="font-size: 13.5px; color: var(--nature-emerald); font-family: 'JetBrains Mono', monospace;">+${ecoCredits} Pts</strong>
              </div>
            </div>

            <button class="spring-tactile-btn" style="width: 100%;" onclick="executeV2VTransfer()">
              EXECUTE V2V POWER TRANSFER
            </button>
          </div>
        </div>
      `;
    }

    /* ZERO-FLICKER REAL-TIME V2V SLIDER UPDATE */
    function updateV2VSlider(val) {
      state.v2vTransferKwh = parseInt(val);
      const kwh = state.v2vTransferKwh;
      const donorSoc = Math.max(15, Math.round(state.donorBattery - (kwh / 72.6 * 100)));
      const receiverSoc = Math.min(100, Math.round(state.userBattery + (kwh / 40.5 * 100)));
      const durationMin = Math.round((kwh / 22.0) * 60);
      const ecoCredits = kwh * 15;
      const pct = (val / 25) * 100;

      const kwhLbl = document.getElementById('kwhLabel');
      if (kwhLbl) kwhLbl.innerText = `${val} kWh`;

      const fill = document.getElementById('v2vFill');
      if (fill) fill.style.width = pct + '%';

      const thumb = document.getElementById('v2vThumb');
      if (thumb) thumb.style.left = pct + '%';

      const donorEl = document.getElementById('donorSocVal');
      if (donorEl) donorEl.innerText = donorSoc + '%';

      const receiverEl = document.getElementById('receiverSocVal');
      if (receiverEl) receiverEl.innerText = receiverSoc + '%';

      const durEl = document.getElementById('v2vDurationVal');
      if (durEl) durEl.innerText = `~${durationMin} min`;

      const ecoEl = document.getElementById('v2vEcoVal');
      if (ecoEl) ecoEl.innerText = `+${ecoCredits} Pts`;
    }

    function executeV2VTransfer() {
      const added = Math.round((state.v2vTransferKwh / 40.5) * 100);
      state.userBattery = Math.min(100, state.userBattery + added);
      state.donorBattery = Math.max(20, state.donorBattery - Math.round((state.v2vTransferKwh / 72.6) * 100));

      fetch(`${API_BASE}/v2v/transfer`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          donor_user_id: "peer_ioniq_01",
          receiver_user_id: "user_live_01",
          kwh_amount: state.v2vTransferKwh,
          transfer_power_kw: 22.0
        })
      }).catch(() => {});

      renderView();
    }

    function pickStation(id) {

    }

    function selectSlot(el, slot) {
      document.querySelectorAll('.slot-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      state.selectedSlot = slot;
    }

    function openReservationModal(id) {
      pickStation(id);
      openTicketModal();
    }

    function openTicketModal() {
      const urgent = isUrgent();
      const st = state.selectedStation;

      document.getElementById('ticketStationName').innerText = st.name;
      document.getElementById('ticketStationAddress').innerText = st.address;
      document.getElementById('ticketBayLabel').innerText = urgent ? "Bay #1 (Emergency 120 kW)" : "Bay #1 (Fast DC)";
      document.getElementById('ticketPriorityLabel').innerText = urgent ? "PRIORITY CONFIRMED" : "CONFIRMED (15 MIN)";
      document.getElementById('ticketPriorityLabel').style.color = urgent ? "var(--crimson-emergency)" : "var(--sky-vibrant)";
      document.getElementById('ticketIdLabel').innerText = "GF-" + Math.floor(1000 + Math.random() * 9000);

      document.getElementById('passBackdrop').style.display = 'flex';
