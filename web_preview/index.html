<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GridFlow AI — Intelligent EV Charging Network</title>
  
  <!-- Mobile Web App & PWA Settings -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GridFlow AI">
  <meta name="theme-color" content="#0284C7">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- Live Mapbox GL JS -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet" />

  <style>
    :root {
      /* Apple Light Nature & Sky Blue EV Palette */
      --sky-electric: #00A3FF;
      --sky-vibrant: #0284C7;
      --sky-soft: #38BDF8;
      --sky-mist: #BAE6FD;
      --sky-aura: #E0F2FE;
      
      --nature-emerald: #059669;
      --nature-leaf: #10B981;
      --nature-mint: #D1FAE5;
      --nature-glow: rgba(16, 185, 129, 0.3);
      
      /* Pure Pearl Glass & Crystal Refraction */
      --glass-body: rgba(255, 255, 255, 0.52);
      --glass-card: rgba(255, 255, 255, 0.62);
      --glass-elevated: rgba(255, 255, 255, 0.78);
      --glass-border: rgba(255, 255, 255, 0.90);
      --glass-border-subtle: rgba(255, 255, 255, 0.65);
      --glass-inner-sheen: inset 0 1.5px 2px rgba(255, 255, 255, 0.95), inset 0 -1px 1px rgba(0, 0, 0, 0.03);
      --glass-shadow: 0 18px 40px -10px rgba(15, 23, 42, 0.12), 0 2px 6px rgba(0, 0, 0, 0.04);
      
      /* Typography Colors (High Human Legibility) */
      --text-headline: #0F172A;
      --text-sub: #334155;
      --text-caption: #64748B;
      --text-emerald: #047857;
      --text-sky: #0369A1;
      
      /* Status */
      --amber-busy: #D97706;
      --crimson-emergency: #DC2626;

      /* Extreme Bouncy Spring Physics */
      --spring-bouncy: cubic-bezier(0.175, 1.45, 0.32, 1.35);
      --spring-dock: cubic-bezier(0.175, 1.45, 0.32, 1.25);
      --macos-zoom: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; 
      -webkit-font-smoothing: antialiased; 
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: 
        radial-gradient(ellipse at 50% 15%, rgba(186, 230, 253, 0.45) 0%, rgba(224, 242, 254, 0.25) 50%, rgba(241, 245, 249, 0.95) 100%),
        url('assets/ev_nature_backdrop.jpg') center/cover no-repeat fixed;
      color: var(--text-headline);
      display: flex;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Glass Blur Backdrop Overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(241, 245, 249, 0.78);
      backdrop-filter: blur(50px);
      -webkit-backdrop-filter: blur(50px);
      z-index: 0;
    }

    /* ============================================================
       CLEAN RESPONSIVE WEB APPLICATION CANVAS
       (No Nested Fake Phone Frame, Full-Screen Responsive)
       ============================================================ */
    .app-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 520px; /* Clean responsive width on desktop; 100% on mobile */
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: 
        linear-gradient(180deg, 
          rgba(224, 242, 254, 0.36) 0%, 
          rgba(248, 250, 252, 0.48) 45%, 
          rgba(209, 250, 229, 0.40) 100%
        ),
        url('assets/ev_nature_backdrop.jpg') center top / cover no-repeat fixed;
      box-shadow: 0 0 50px rgba(15, 23, 42, 0.08);
    }

    @media (max-width: 600px) {
      .app-container {
        max-width: 100%;
        box-shadow: none;
      }
    }

    /* CLEAN WEB APP HEADER (No Fake Status Bar) */
    .app-header {
      padding: max(16px, env(safe-area-inset-top)) 20px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(255, 255, 255, 0.35);
      border-bottom: 0.5px solid rgba(255, 255, 255, 0.6);
    }
    .brand-group h2 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-headline);
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .brand-group p {
      font-size: 11px;
      color: var(--sky-vibrant);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-top: 2px;
    }
    .header-live-badge {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      border: 0.8px solid rgba(255, 255, 255, 1);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      color: var(--nature-emerald);
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      letter-spacing: 0.3px;
    }
    .pulsing-emerald {
      width: 7px;
      height: 7px;
      background: var(--nature-leaf);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--nature-leaf);
      animation: pulseBreath 2s infinite ease-in-out;
    }
    @keyframes pulseBreath {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.35); opacity: 1; box-shadow: 0 0 16px var(--nature-leaf); }
    }

    /* SCROLLABLE VIEWPORT (Full responsive breathing room) */
    .scroll-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 20px max(96px, calc(76px + env(safe-area-inset-bottom)));
      display: flex;
      flex-direction: column;
      scroll-behavior: smooth;
    }
    .scroll-body::-webkit-scrollbar { width: 0; }

    /* UNIFIED SCREEN VIEW WRAPPER */
    .view-content {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
      animation: macosWindowIn 0.35s var(--macos-zoom);
    }
    @keyframes macosWindowIn {
      0% { opacity: 0; transform: scale(0.97) translateY(8px); filter: blur(4px); }
      100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
    }

    /* AUTHENTIC APPLE LIQUID GLASS FLOATING PANELS */
    .glass-panel {
      position: relative;
      background: var(--glass-card);
      backdrop-filter: blur(30px) saturate(210%);
      -webkit-backdrop-filter: blur(30px) saturate(210%);
      border-radius: 24px;
      padding: 18px 20px;
      border: 0.8px solid var(--glass-border);
      box-shadow: var(--glass-shadow), var(--glass-inner-sheen);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      overflow: hidden;
      width: 100%;
    }
    .glass-panel:hover {
      transform: translateY(-2px);
      background: var(--glass-elevated);
      border-color: #FFFFFF;
      box-shadow: 0 20px 48px -10px rgba(15, 23, 42, 0.15), var(--glass-inner-sheen);
    }
    /* Sunlight Specular Refraction Sheen */
    .glass-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 45%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.12) 60%, transparent 100%);
      pointer-events: none;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
    }

    /* TYPOGRAPHY STANDARDS (Apple HIG Clean Minimal Standard) */
    .view-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text-headline);
      letter-spacing: -0.4px;
      margin-bottom: 2px;
    }
    .view-caption {
      font-size: 12px;
      color: var(--text-caption);
      line-height: 1.35;
    }

    /* HIGH IMPACT METRIC TAGS */
    .hero-stat-tag {
      font-size: 10.5px;
      font-weight: 800;
      padding: 4px 11px;
      border-radius: 999px;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .tag-sky {
      background: var(--sky-aura);
      color: var(--sky-vibrant);
      border: 0.5px solid rgba(2, 132, 199, 0.3);
    }
    .tag-emerald {
      background: var(--nature-mint);
      color: var(--nature-emerald);
      border: 0.5px solid rgba(16, 185, 129, 0.3);
    }
    .tag-crimson {
      background: #FEE2E2;
      color: var(--crimson-emergency);
      border: 0.5px solid rgba(239, 68, 68, 0.3);
    }

    /* TACTILE SPRING BUTTONS */
    .spring-tactile-btn {
      position: relative;
      background: linear-gradient(135deg, #00A3FF 0%, #0284C7 45%, #10B981 100%);
      color: #FFFFFF;
      border: none;
      padding: 14px 20px;
      border-radius: 18px;
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: -0.2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 
        0 10px 25px -4px rgba(0, 163, 255, 0.45),
        0 0 14px rgba(16, 185, 129, 0.25),
        inset 0 1.5px 2px rgba(255, 255, 255, 0.6);
      transition: transform 0.35s var(--spring-bouncy), box-shadow 0.25s ease;
      user-select: none;
    }
    .spring-tactile-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 14px 32px -4px rgba(0, 163, 255, 0.6), 0 0 20px rgba(16, 185, 129, 0.35);
    }
    .spring-tactile-btn:active {
      transform: translateY(2px) scale(0.92);
      box-shadow: 0 4px 10px rgba(0, 163, 255, 0.3);
    }

    /* LIQUID MORPHING SLIDER */
    .slider-container {
      margin: 12px 0 4px;
      position: relative;
    }
    .slider-sunlit-track {
      width: 100%;
      height: 10px;
      background: rgba(226, 232, 240, 0.7);
      border-radius: 999px;
      position: relative;
      overflow: hidden;
      border: 0.5px solid rgba(255, 255, 255, 0.9);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.06);
    }
    .slider-fluid-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      background: linear-gradient(90deg, #0284C7 0%, #00A3FF 60%, #10B981 100%);
      border-radius: 999px;
      box-shadow: 0 0 12px rgba(0, 163, 255, 0.4);
      transition: width 0.04s linear;
    }
    .slider-input-overlay {
      position: absolute;
      top: -7px; left: 0;
      width: 100%;
      height: 24px;
      opacity: 0;
      cursor: pointer;
      z-index: 10;
    }
    .slider-lens-thumb {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 24px;
      height: 24px;
      background: #FFFFFF;
      border-radius: 50%;
      box-shadow: 0 3px 12px rgba(15, 23, 42, 0.18), 0 0 14px var(--sky-electric);
      pointer-events: none;
      transition: left 0.04s linear, transform 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.95);
    }

    /* ============================================================
       RESPONSIVE FLOATING LIQUID GLASS CAPSULE DOCK
       ============================================================ */
    .floating-mac-dock {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 440px;
      height: 60px;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(36px) saturate(220%);
      -webkit-backdrop-filter: blur(36px) saturate(220%);
      border-radius: 30px;
      border: 0.8px solid rgba(255, 255, 255, 0.95);
      box-shadow: 
        0 20px 44px -8px rgba(15, 23, 42, 0.18),
        inset 0 1.5px 2px rgba(255, 255, 255, 1),
        inset 0 -1px 1px rgba(0, 0, 0, 0.04);
      display: flex;
      align-items: center;
      padding: 5px;
      z-index: 90;
    }
    /* Gliding Liquid Refractive Bubble Lens (Percentage Based) */
    .dock-glide-bubble {
      position: absolute;
      height: 50px;
      width: calc((100% - 10px) / 3);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98) 0%, rgba(240, 249, 255, 0.92) 100%);
      border-radius: 25px;
      border: 0.8px solid rgba(255, 255, 255, 1);
      box-shadow: 
        0 10px 24px rgba(0, 163, 255, 0.28),
        inset 2.5px 0 5px rgba(0, 163, 255, 0.5),
        inset -2.5px 0 5px rgba(16, 185, 129, 0.5),
        inset 0 2px 4px rgba(255, 255, 255, 1),
        inset 0 -2px 4px rgba(251, 191, 36, 0.25);
      top: 5px;
      left: 5px;
      pointer-events: none;
      transition: transform 0.42s var(--spring-dock);
      z-index: 1;
    }
    .dock-tab {
      position: relative;
      z-index: 2;
      background: none;
      border: none;
      flex: 1;
      height: 50px;
      color: var(--text-caption);
      font-size: 11.5px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      transition: transform 0.35s var(--spring-bouncy), color 0.2s ease;
      user-select: none;
    }
    .dock-tab.active {
      color: var(--sky-vibrant);
      transform: scale(1.12);
      text-shadow: 0 0 14px rgba(0, 163, 255, 0.45);
    }
    .dock-icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* SCREEN 2: V2V P2P LIQUID DIALS */
    .v2v-nature-stage {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px;
    }
    .car-orb {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 105px;
    }
    .orb-ring {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
      box-shadow: 0 10px 22px rgba(0, 163, 255, 0.15);
      position: relative;
    }
    .orb-center {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 800;
      color: var(--text-headline);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }
    .orb-model { font-size: 12px; font-weight: 800; color: var(--text-headline); }
    .orb-sub { font-size: 10px; color: var(--text-caption); margin-top: 1px; }

    /* Animated Nature Energy Beam */
    .beam-sunlit-conduit {
      flex: 1;
      height: 6px;
      background: rgba(226, 232, 240, 0.6);
      border-radius: 999px;
      margin: 0 12px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
    }
    .beam-stream {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 50%;
      background: linear-gradient(90deg, transparent, #00A3FF, #10B981, transparent);
      box-shadow: 0 0 14px #00A3FF;
      animation: streamFlow 1.1s linear infinite;
    }
    @keyframes streamFlow {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    /* ============================================================
       SCREEN 3: LIVE MAPBOX GL CONTAINER & CUSTOM MARKERS
       ============================================================ */
    .mapbox-wrapper {
      position: relative;
      height: 270px;
      width: 100%;
      border-radius: 24px;
      overflow: hidden;
      border: 0.8px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 10px 28px -6px rgba(15, 23, 42, 0.16);
      background: #EBF4FC;
    }
    #mapboxMap {
      width: 100%;
      height: 100%;
    }
    .mapboxgl-canvas {
      border-radius: 24px;
    }

    /* Custom Mapbox Station Pin Callouts */
    .mapbox-station-marker {
      cursor: pointer;
      transition: transform 0.25s var(--spring-bouncy);
    }
    .mapbox-station-marker:hover {
      transform: translateY(-3px) scale(1.06);
      z-index: 50;
    }
    .mapbox-station-marker.active {
      transform: translateY(-2px) scale(1.08);
      z-index: 60;
    }
    .marker-pill {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 1);
      padding: 5px 9px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.18);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .mapbox-station-marker.active .marker-pill {
      border-color: var(--sky-electric);
      background: #FFFFFF;
      box-shadow: 0 8px 24px rgba(0, 163, 255, 0.4);
    }
    .marker-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .marker-dot.emerald {
      background: var(--nature-leaf);
      box-shadow: 0 0 8px var(--nature-leaf);
    }
    .marker-dot.crimson {
      background: var(--crimson-emergency);
      box-shadow: 0 0 8px var(--crimson-emergency);
    }
    .marker-info {
      display: flex;
      flex-direction: column;
    }
    .marker-name {
      font-size: 9.5px;
      font-weight: 800;
      color: var(--text-headline);
    }
    .marker-meta {
      font-size: 8px;
      color: var(--text-caption);
      font-weight: 700;
    }

    /* Mapbox GPS User Puck */
    .mapbox-user-puck {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }
    .mapbox-user-puck .gps-pulse {
      position: absolute;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(0, 163, 255, 0.28);
      animation: gpsPulseAnim 2s infinite ease-out;
      top: -9px;
    }
    .mapbox-user-puck .gps-dot {
      width: 14px;
      height: 14px;
      background: var(--sky-electric);
      border: 2.5px solid #FFFFFF;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0, 163, 255, 0.6);
      z-index: 2;
    }
    .mapbox-user-puck .gps-badge {
      background: rgba(15, 23, 42, 0.85);
      color: #FFFFFF;
      font-size: 8px;
      font-weight: 800;
      padding: 1.5px 5px;
      border-radius: 5px;
      margin-top: 3px;
      white-space: nowrap;
    }
    @keyframes gpsPulseAnim {
      0% { transform: scale(0.6); opacity: 0.9; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    /* 15-Minute Slot Chips */
    .slot-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin: 8px 0 12px;
    }
    .slot-card {
      background: rgba(255, 255, 255, 0.72);
      border: 0.8px solid rgba(255, 255, 255, 1);
      border-radius: 13px;
      padding: 8px 4px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .slot-card.selected {
      background: linear-gradient(135deg, #00A3FF 0%, #10B981 100%);
      color: #FFF;
      box-shadow: 0 6px 18px rgba(0, 163, 255, 0.4);
      transform: scale(1.04);
    }
    .slot-card .time { font-size: 12.5px; font-weight: 800; }
    .slot-card .sub { font-size: 8.5px; opacity: 0.85; margin-top: 1px; }

    /* APPLE WALLET DIGITAL PASS MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: modalZoomIn 0.3s var(--macos-zoom);
    }
    @keyframes modalZoomIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }
    .pass-ticket {
      width: 100%;
      max-width: 440px;
      background: #FFFFFF;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 1);
      box-shadow: 0 35px 70px -15px rgba(15, 23, 42, 0.28);
      padding: 22px;
      position: relative;
    }

    /* REAL USER GPS PILL & LOCATION BUTTONS */
    .gps-location-pill {
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(16px);
      border: 0.8px solid rgba(0, 163, 255, 0.45);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      color: var(--sky-vibrant);
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      transition: all 0.25s ease;
    }
    .gps-location-pill:hover {
      background: #FFFFFF;
      border-color: var(--sky-electric);
      transform: scale(1.04);
    }
    .gps-location-pill.active {
      color: var(--nature-emerald);

    function showToast(msg, duration = 3200) {
      const toast = document.getElementById('liveToast');

      toast.innerHTML = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, duration);
    }

    function haversineDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; // Earth's radius in km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c * 10) / 10;
    }

    function recalculateDistances() {
      state.stations.forEach(s => {
        s.distance_km = haversineDistance(state.userLat, state.userLon, s.lat, s.lon);
      });
      state.stations.sort((a, b) => a.distance_km - b.distance_km);
      if (!state.selectedStation || !state.stations.some(s => s.id === state.selectedStation.id)) {
        state.selectedStation = state.stations[0];
      }
    }

    function requestUserLocation() {
      if (!navigator.geolocation) {
        showToast("⚠️ Geolocation is not supported by your browser.");
        return;
      }
      showToast("📍 Requesting GPS location permission...");
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          state.userLat = pos.coords.latitude;
          state.userLon = pos.coords.longitude;
          state.locationAccuracy = Math.round(pos.coords.accuracy);
          state.gpsLocked = true;

          const pill = document.getElementById('gpsLocationBtn');
          const lbl = document.getElementById('gpsPillLabel');
          if (pill && lbl) {
            pill.classList.add('active');
            lbl.innerText = `📍 ${state.userLat.toFixed(2)}, ${state.userLon.toFixed(2)}`;
          }

          recalculateDistances();

          if (mapboxInstance) {
            if (userPuckMarker) {
              userPuckMarker.setLngLat([state.userLon, state.userLat]);
            }
            mapboxInstance.flyTo({
              center: [state.userLon, state.userLat],
              zoom: 12.8,
              essential: true
            });
            updateMapboxMarkers();
          }

          renderView();
          showToast(`📍 Live GPS Locked: ${state.userLat.toFixed(4)}, ${state.userLon.toFixed(4)} (±${state.locationAccuracy}m)`);
        },
        (err) => {
          console.warn("Geolocation permission error:", err);
          showToast("📍 Location permission prompt shown. Please click Allow.");
        },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
      );
    }

    function init() {
      state.selectedStation = state.stations[0];
      recalculateDistances();
      renderView();

      // Automatically request user GPS permission on startup
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            state.userLat = pos.coords.latitude;
            state.userLon = pos.coords.longitude;
            state.locationAccuracy = Math.round(pos.coords.accuracy);
            state.gpsLocked = true;

            const pill = document.getElementById('gpsLocationBtn');
            const lbl = document.getElementById('gpsPillLabel');
            if (pill && lbl) {
              pill.classList.add('active');
              lbl.innerText = `📍 ${state.userLat.toFixed(2)}, ${state.userLon.toFixed(2)}`;
            }

            recalculateDistances();

            if (mapboxInstance && userPuckMarker) {
              userPuckMarker.setLngLat([state.userLon, state.userLat]);
              mapboxInstance.flyTo({ center: [state.userLon, state.userLat], zoom: 12.5 });
              updateMapboxMarkers();

            renderView();
            showToast(`📍 Live GPS Active: ${state.userLat.toFixed(4)}, ${state.userLon.toFixed(4)}`);

          (err) => {
            console.log("Initial geolocation note:", err.message);
          },
          { enableHighAccuracy: true, timeout: 6000 }
        );
      }

      // Fetch live stations from backend if online
      fetch(`${API_BASE}/stations`)
        .then(res => res.json())
        .then(data => {
          if (data && data.stations && data.stations.length > 0) {
            state.stations = data.stations.map((s) => ({
              ...s,
              distance_km: haversineDistance(state.userLat, state.userLon, s.lat, s.lon),
              queue_length: s.queue_length !== undefined ? s.queue_length : 1

            recalculateDistances();
            renderView();
            if (state.activeTab === 2) {
              updateMapboxMarkers();
            }
          }
        })
        .catch(() => {});
    }

      document.querySelectorAll('.dock-tab').forEach((tab, i) => {
        if (i === idx) tab.classList.add('active');
        else tab.classList.remove('active');

      const hTag = document.getElementById('screen1HeaderTag');
      if (hTag) {
        hTag.innerText = urgent ? 'PRIORITY LEAPFROG' : 'OPTIMAL GRID';
        hTag.className = `hero-stat-tag ${urgent ? 'tag-crimson' : 'tag-sky'}`;
      }

      const mTag = document.getElementById('recommendMatchTag');
      if (mTag) {
        mTag.innerText = urgent ? '🚨 EMERGENCY DISPATCH' : '✨ OPTIMAL MATCH';
        mTag.className = `hero-stat-tag ${urgent ? 'tag-crimson' : 'tag-sky'}`;
      }

      const waitEl = document.getElementById('recWaitTimeVal');
      if (waitEl) {
        waitEl.innerText = urgent ? '~0 min' : `~${state.stations[0].predicted_wait_min} min`;
        waitEl.style.color = urgent ? 'var(--crimson-emergency)' : 'var(--sky-vibrant)';
      }

      const scoreEl = document.getElementById('recScoreBadge');
      if (scoreEl) {
        scoreEl.innerText = urgent ? '99/100' : '96/100';
      }

      const btn = document.getElementById('recActionBtn');
      if (btn) {
        btn.innerText = urgent ? 'DISPATCH EMERGENCY BAY #1' : 'RESERVE 15-MIN BAY';
      }
    }

    /* ============================================================
       SCREEN 2: V2V P2P ENERGY SHARING HUB
       ============================================================ */
    function renderScreen2(body) {
      const kwh = state.v2vTransferKwh;
      const donorSoc = Math.max(15, Math.round(state.donorBattery - (kwh / 72.6 * 100)));
      const receiverSoc = Math.min(100, Math.round(state.userBattery + (kwh / 40.5 * 100)));
      const durationMin = Math.round((kwh / 22.0) * 60);
      const ecoCredits = kwh * 15;

      body.innerHTML = `
        <div class="view-content">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <div>
              <div class="view-title">V2V Energy Sharing</div>
              <div class="view-caption">Peer-to-peer mobile power transfer</div>
            </div>
            <span class="hero-stat-tag tag-sky">P2P LINK READY</span>
          </div>

          <!-- CAR-TO-CAR STAGE -->
          <div class="glass-panel">
            <div class="v2v-nature-stage">
              <!-- DONOR -->
              <div class="car-orb">
                <div class="orb-ring" style="background: conic-gradient(var(--sky-vibrant) ${donorSoc}%, #E2E8F0 0);">
                  <div class="orb-center" id="donorSocVal">${donorSoc}%</div>
                </div>
                <div class="orb-model">Ioniq 5</div>
                <div class="orb-sub">Peer Donor</div>
              </div>

              <!-- SUNLIT ENERGY BEAM -->
              <div class="beam-sunlit-conduit">
                <div class="beam-stream"></div>
              </div>

              <!-- RECEIVER -->
              <div class="car-orb">
                <div class="orb-ring" style="background: conic-gradient(#10B981 ${receiverSoc}%, #E2E8F0 0);">
                  <div class="orb-center" id="receiverSocVal" style="color: var(--nature-emerald);">${receiverSoc}%</div>
                </div>
                <div class="orb-model">Nexon EV</div>
                <div class="orb-sub">Your Car</div>
              </div>
            </div>

            <div style="display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-sub); border-top: 1px solid rgba(241, 245, 249, 0.8); padding-top: 10px; margin-top: 4px;">
              <span>Distance: <strong style="color: var(--text-headline);">${state.donorDistanceKm} km away</strong></span>
              <span>Rate: <strong style="color: var(--sky-vibrant);">22 kW DC Fast</strong></span>
            </div>
          </div>

          <!-- KWH SLIDER PANEL -->
          <div class="glass-panel">
            <div style="display: flex; justify-content: space-between; align-items: baseline;">
              <span style="font-size: 13.5px; font-weight: 800;">Transfer Energy</span>
              <span style="font-size: 22px; font-weight: 800; color: var(--sky-vibrant); font-family: 'JetBrains Mono', monospace;" id="kwhLabel">
                ${kwh} kWh
              </span>
            </div>

            <div class="slider-container">
              <div class="slider-sunlit-track">
                <div class="slider-fluid-fill" id="v2vFill" style="width: ${(kwh / 25) * 100}%;"></div>
              </div>
              <input type="range" min="3" max="25" value="${kwh}" class="slider-input-overlay" oninput="updateV2VSlider(this.value)">
              <div class="slider-lens-thumb" id="v2vThumb" style="left: ${(kwh / 25) * 100}%;"></div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 14px;">
              <div style="background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); padding: 10px; border-radius: 14px; border: 0.5px solid rgba(255,255,255,1);">
                <span style="font-size: 8.5px; color: var(--text-caption); display: block; font-weight: 700;">DURATION</span>
                <strong id="v2vDurationVal" style="font-size: 13.5px; font-family: 'JetBrains Mono', monospace;">~${durationMin} min</strong>
              </div>
              <div style="background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); padding: 10px; border-radius: 14px; border: 0.5px solid rgba(255,255,255,1);">
                <span style="font-size: 8.5px; color: var(--text-caption); display: block; font-weight: 700;">ECOREWARD</span>
                <strong id="v2vEcoVal" style="font-size: 13.5px; color: var(--nature-emerald); font-family: 'JetBrains Mono', monospace;">+${ecoCredits} Pts</strong>
              </div>
            </div>

            <button class="spring-tactile-btn" style="width: 100%;" onclick="executeV2VTransfer()">
              EXECUTE V2V POWER TRANSFER
            </button>
          </div>
        </div>
      `;
    }

    /* IN-PLACE ZERO-FLICKER REAL-TIME V2V SLIDER */
    function updateV2VSlider(val) {
      state.v2vTransferKwh = parseInt(val);
      const kwh = state.v2vTransferKwh;
      const donorSoc = Math.max(15, Math.round(state.donorBattery - (kwh / 72.6 * 100)));
      const receiverSoc = Math.min(100, Math.round(state.userBattery + (kwh / 40.5 * 100)));
      const durationMin = Math.round((kwh / 22.0) * 60);
      const ecoCredits = kwh * 15;
      const pct = (val / 25) * 100;

      const kwhLbl = document.getElementById('kwhLabel');
      if (kwhLbl) kwhLbl.innerText = `${val} kWh`;

      const fill = document.getElementById('v2vFill');
      if (fill) fill.style.width = pct + '%';

      const thumb = document.getElementById('v2vThumb');
      if (thumb) thumb.style.left = pct + '%';

      const donorEl = document.getElementById('donorSocVal');
      if (donorEl) donorEl.innerText = donorSoc + '%';

      const receiverEl = document.getElementById('receiverSocVal');
      if (receiverEl) receiverEl.innerText = receiverSoc + '%';

      const durEl = document.getElementById('v2vDurationVal');
      if (durEl) durEl.innerText = `~${durationMin} min`;

      const ecoEl = document.getElementById('v2vEcoVal');
      if (ecoEl) ecoEl.innerText = `+${ecoCredits} Pts`;
    }

    function executeV2VTransfer() {
      const added = Math.round((state.v2vTransferKwh / 40.5) * 100);
      state.userBattery = Math.min(100, state.userBattery + added);
      state.donorBattery = Math.max(20, state.donorBattery - Math.round((state.v2vTransferKwh / 72.6) * 100));
      const eco = state.v2vTransferKwh * 15;

      showToast(`⚡ V2V Complete: +${state.v2vTransferKwh} kWh transferred. +${eco} EcoCredits awarded!`);

      fetch(`${API_BASE}/v2v/transfer`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          donor_user_id: "peer_ioniq_01",
          receiver_user_id: "user_live_01",
          kwh_amount: state.v2vTransferKwh,
          transfer_power_kw: 22.0
        })
      }).catch(() => {});

      renderView();
    }

    /* ============================================================
       SCREEN 3: REALISTIC LIVE MAPBOX GL MAP & RESERVATIONS
       ============================================================ */
    function renderScreen3(body) {
      const cur = state.selectedStation;

      body.innerHTML = `
        <div class="view-content">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
              <div class="view-title">Charging Network Map</div>
              <div class="view-caption" id="locationStatusCaption">
                ${state.gpsLocked ? `📍 Live GPS: ${state.userLat.toFixed(3)}, ${state.userLon.toFixed(3)}` : 'Live Mapbox GL stations & corridor wait times'}
              </div>
            </div>
            <button class="gps-locate-btn" onclick="requestUserLocation()" title="Request real user GPS location">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
              </svg>
              <span>${state.gpsLocked ? 'GPS Active' : 'Locate Me'}</span>
            </button>
          </div>

          <!-- LIVE MAPBOX GL CONTAINER -->
          <div class="mapbox-wrapper">
            <div id="mapboxMap"></div>
          </div>

          <!-- SELECTED STATION DETAIL & RESERVATION CARD -->
          <div class="glass-panel" id="selectedStationCard">
            ${renderSelectedStationCard(cur)}
          </div>
        </div>
      `;
    }

    function renderSelectedStationCard(cur) {
      return `
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
          <div>
            <div style="font-size: 16px; font-weight: 800; color: var(--text-headline);">${cur.name}</div>
            <div style="font-size: 11.5px; color: var(--text-caption);">${cur.address}</div>
          </div>
          <span class="hero-stat-tag ${cur.chargers_available > 0 ? 'tag-sky' : 'tag-crimson'}">
            ${cur.chargers_available > 0 ? cur.chargers_available + ' Free Bays' : 'Full (Wait ~24m)'}
          </span>
        </div>

        <!-- 4 Clean Live Station Telemetry Badges -->
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(12px); padding: 9px; border-radius: 13px; border: 0.5px solid rgba(255, 255, 255, 1);">
          <div>
            <span style="font-size: 8px; color: var(--text-caption); display: block; font-weight: 700;">QUEUE</span>
            <strong style="font-size: 11.5px; font-family: 'JetBrains Mono', monospace; color: ${cur.queue_length > 2 ? 'var(--crimson-emergency)' : 'var(--nature-emerald)'};">
              ${cur.queue_length} cars
            </strong>
          </div>
          <div>
            <span style="font-size: 8px; color: var(--text-caption); display: block; font-weight: 700;">PRICE</span>
            <strong style="font-size: 11.5px; font-family: 'JetBrains Mono', monospace;">₹${cur.price_per_kwh}</strong>
          </div>
          <div>
            <span style="font-size: 8px; color: var(--text-caption); display: block; font-weight: 700;">DIST.</span>
            <strong style="font-size: 11.5px; font-family: 'JetBrains Mono', monospace;">${cur.distance_km} km</strong>
          </div>
          <div>
            <span style="font-size: 8px; color: var(--text-caption); display: block; font-weight: 700;">WAIT</span>
            <strong style="font-size: 11.5px; font-family: 'JetBrains Mono', monospace; color: var(--sky-vibrant);">
              ~${cur.predicted_wait_min}m
            </strong>
          </div>
        </div>

        <div>
          <span style="font-size: 9.5px; font-weight: 800; color: var(--text-caption); text-transform: uppercase; letter-spacing: 0.5px;">
            Select 15-Minute Slot
          </span>

          <div class="slot-row">
            <div class="slot-card selected" onclick="selectSlot(this, '18:45')">
              <div class="time">18:45</div>
              <div class="sub">Ready</div>
            </div>
            <div class="slot-card" onclick="selectSlot(this, '19:00')">
              <div class="time">19:00</div>
              <div class="sub">+15m</div>
            </div>
            <div class="slot-card" onclick="selectSlot(this, '19:15')">
              <div class="time">19:15</div>
              <div class="sub">+30m</div>
            </div>
            <div class="slot-card" onclick="selectSlot(this, '19:30')">
              <div class="time">19:30</div>
              <div class="sub">+45m</div>
            </div>
          </div>
        </div>

        <button class="spring-tactile-btn" style="width: 100%;" onclick="openTicketModal()">
          CONFIRM & GENERATE DIGITAL PASS
        </button>
      `;
    }

    /* ============================================================
       REAL MAPBOX GL JS INITIALIZATION & MARKERS
       ============================================================ */
    function initMapbox() {
      const mapDiv = document.getElementById('mapboxMap');
      if (!mapDiv) return;

      if (!window.mapboxgl) {
        console.warn("Mapbox GL JS is still loading...");
        setTimeout(initMapbox, 200);
        return;
      }

      mapboxgl.accessToken = MAPBOX_TOKEN;

      try {
        mapboxInstance = new mapboxgl.Map({
          container: 'mapboxMap',
          style: 'mapbox://styles/mapbox/light-v11',
          center: [state.userLon, state.userLat],
          zoom: 11.5,
          pitch: 20,
          attributionControl: false
        });

        mapboxInstance.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'top-right');

        mapboxInstance.on('load', () => {
          // Add User Location GPS Puck
          const userEl = document.createElement('div');
          userEl.className = 'mapbox-user-puck';
          userEl.innerHTML = `
            <div class="gps-pulse"></div>
            <div class="gps-dot"></div>
            <div class="gps-badge">You (${state.gpsLocked ? 'Live GPS' : 'Nexon EV'})</div>
          `;
          userPuckMarker = new mapboxgl.Marker({ element: userEl, anchor: 'center' })
            .setLngLat([state.userLon, state.userLat])
            .addTo(mapboxInstance);

          updateMapboxMarkers();
        });
      } catch (err) {
        console.error("Mapbox init error:", err);
      }
    }

    function updateMapboxMarkers() {
      if (!mapboxInstance) return;

      // Clear existing markers
      stationMarkers.forEach(m => m.remove());
      stationMarkers = [];

      state.stations.forEach(s => {
        const isSelected = state.selectedStation && state.selectedStation.id === s.id;
        const el = document.createElement('div');
        el.className = `mapbox-station-marker ${isSelected ? 'active' : ''}`;
        el.innerHTML = `
          <div class="marker-pill">
            <div class="marker-dot ${s.chargers_available > 0 ? 'emerald' : 'crimson'}"></div>
            <div class="marker-info">
              <span class="marker-name">${s.name}</span>
              <span class="marker-meta">${s.queue_length} queue • ₹${s.price_per_kwh}/kWh</span>
            </div>
          </div>
        `;

        el.addEventListener('click', (e) => {
          e.stopPropagation();
          pickStation(s.id);
        });

        const marker = new mapboxgl.Marker({ element: el, anchor: 'bottom' })
          .setLngLat([s.lon, s.lat])
          .addTo(mapboxInstance);

        stationMarkers.push(marker);
      });
    }

    function pickStation(id) {
      const s = state.stations.find(st => st.id === id) || state.stations[0];
      state.selectedStation = s;
      if (state.activeTab === 2) {
        const card = document.getElementById('selectedStationCard');
        if (card) {
          card.innerHTML = renderSelectedStationCard(s);
        }
        updateMapboxMarkers();
        if (mapboxInstance) {
          mapboxInstance.flyTo({ center: [s.lon, s.lat], zoom: 12.8, essential: true });
        }
      } else {
        renderView();
      }
    }

    function selectSlot(el, slot) {
      document.querySelectorAll('.slot-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      state.selectedSlot = slot;
    }

    function openReservationModal(id) {
      pickStation(id);
      openTicketModal();
    }

    function openTicketModal() {
      const urgent = isUrgent();
      const st = state.selectedStation;

      document.getElementById('ticketStationName').innerText = st.name;
      document.getElementById('ticketStationAddress').innerText = st.address;
      document.getElementById('ticketBayLabel').innerText = urgent ? "Bay #1 (Emergency 120 kW)" : "Bay #1 (Fast DC)";
      document.getElementById('ticketPriorityLabel').innerText = urgent ? "PRIORITY CONFIRMED" : "CONFIRMED (15 MIN)";
      document.getElementById('ticketPriorityLabel').style.color = urgent ? "var(--crimson-emergency)" : "var(--sky-vibrant)";
      document.getElementById('ticketIdLabel').innerText = "GF-" + Math.floor(1000 + Math.random() * 9000);

      document.getElementById('passBackdrop').style.display = 'flex';
    }

    function closeTicketModal() {
      document.getElementById('passBackdrop').style.display = 'none';
      switchDockTab(0);
    }

    // Launch
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
