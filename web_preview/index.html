<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GridFlow AI — Apple Liquid Glass (Light Nature Edition)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Apple Light Nature & Pristine Pearl Palette */
      --sky-light: #EBF5FF;
      --sky-pearl: #F8FAFC;
      --nature-emerald: #059669;
      --nature-leaf: #10B981;
      --nature-mint: #E6F4EA;
      --nature-glow: rgba(16, 185, 129, 0.28);
      
      /* Pure Pearl Glass & Crystal Refraction */
      --glass-body: rgba(255, 255, 255, 0.62);
      --glass-card: rgba(255, 255, 255, 0.72);
      --glass-elevated: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(255, 255, 255, 0.95);
      --glass-border-subtle: rgba(255, 255, 255, 0.65);
      --glass-inner-sheen: inset 0 1.5px 2px rgba(255, 255, 255, 1), inset 0 -1px 1px rgba(0, 0, 0, 0.03);
      --glass-shadow: 0 20px 48px -12px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(0, 0, 0, 0.02);
      
      /* Typography Colors (High Human Legibility) */
      --text-headline: #0F172A;
      --text-sub: #475569;
      --text-caption: #64748B;
      --text-emerald: #047857;
      
      /* Status */
      --amber-busy: #D97706;
      --crimson-emergency: #DC2626;

      /* Spring Physics Damping & Elastic Curves */
      --spring-tactile: cubic-bezier(0.34, 1.56, 0.64, 1);
      --spring-rubberband: cubic-bezier(0.175, 0.885, 0.32, 1.275);
      --macos-zoom: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }

    body {
      min-height: 100vh;
      /* Soft morning sky and pearlescent mist background with organic nature lighting */
      background: 
        radial-gradient(60% 60% at 85% 15%, rgba(16, 185, 129, 0.12) 0%, transparent 60%),
        radial-gradient(70% 70% at 15% 25%, rgba(56, 189, 248, 0.14) 0%, transparent 60%),
        linear-gradient(175deg, #EFF6FF 0%, #F1F5F9 45%, #E2E8F0 100%);
      color: var(--text-headline);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    /* Ambient Sunbeam Glow Orbs */
    .sunbeam-aura {
      position: fixed;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.8) 0%, rgba(220, 252, 231, 0.4) 40%, transparent 70%);
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(40px);
    }

    /* Header Bar */
    .studio-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      z-index: 10;
    }
    .status-capsule {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(20px);
      border: 0.5px solid rgba(255, 255, 255, 1);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.04);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      color: var(--nature-emerald);
      display: flex;
      align-items: center;
      gap: 7px;
      letter-spacing: 0.3px;
    }
    .pulsing-emerald {
      width: 7px;
      height: 7px;
      background: var(--nature-leaf);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--nature-leaf);
      animation: pulseBreath 2s infinite ease-in-out;
    }
    @keyframes pulseBreath {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 14px var(--nature-leaf); }
    }

    /* iPhone 16 Pro Natural Pearl Shell */
    .iphone-shell {
      position: relative;
      width: 405px;
      height: 844px;
      background: #FFFFFF;
      border-radius: 54px;
      padding: 11px;
      box-shadow: 
        0 40px 90px -20px rgba(15, 23, 42, 0.16),
        0 0 0 1px rgba(255, 255, 255, 1),
        0 0 40px rgba(16, 185, 129, 0.08),
        inset 0 1px 2px rgba(255, 255, 255, 0.9);
      z-index: 10;
      display: flex;
      flex-direction: column;
    }
    .screen-surface {
      position: relative;
      flex: 1;
      /* Nature Photography Atmosphere (Sunlit EV Corridor in Green Forest) */
      background: 
        linear-gradient(180deg, rgba(255, 255, 255, 0.82) 0%, rgba(240, 249, 245, 0.72) 40%, rgba(230, 244, 238, 0.85) 100%),
        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="800" viewBox="0 0 400 800"><defs><radialGradient id="sun" cx="50%" cy="10%" r="50%"><stop offset="0%" stop-color="%23A7F3D0" stop-opacity="0.35"/><stop offset="100%" stop-color="%23BAE6FD" stop-opacity="0"/></radialGradient></defs><rect width="400" height="800" fill="url(%23sun)"/><path d="M-50 450 Q 150 400 450 500 L450 800 L-50 800 Z" fill="%23059669" fill-opacity="0.04"/><path d="M-50 550 Q 200 480 450 580 L450 800 L-50 800 Z" fill="%2310B981" fill-opacity="0.05"/></svg>');
      background-size: cover;
      background-position: center;
      border-radius: 44px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.9);
    }

    /* Dynamic Island */
    .status-row {
      height: 44px;
      padding: 12px 28px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-headline);
      z-index: 50;
    }
    .dynamic-capsule {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 122px;
      height: 30px;
      background: #000;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 60;
      transition: all 0.4s var(--spring-tactile);
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    }
    .dynamic-capsule.expanded {
      width: 220px;
      height: 38px;
      padding: 0 16px;
    }
    .capsule-content {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: #34D399;
      font-weight: 700;
    }

    /* App Nav Header */
    .app-header {
      padding: 10px 22px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
    }
    .brand-group h2 {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-headline);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-group p {
      font-size: 10px;
      color: var(--nature-emerald);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    /* DEMO MODE SWITCH PILL */
    .demo-pill-btn {
      background: rgba(255, 255, 255, 0.9);
      border: 0.5px solid var(--nature-leaf);
      padding: 5px 12px;
      border-radius: 999px;
      color: var(--nature-emerald);
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
      transition: all 0.25s var(--spring-tactile);
    }
    .demo-pill-btn:hover {
      transform: scale(1.05);
      background: #FFFFFF;
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.25);
    }
    .demo-pill-btn:active {
      transform: scale(0.95);
    }

    /* SCROLLABLE VIEWPORT WITH GENEROUS BREATHING ROOM */
    .scroll-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px 18px 90px; /* 90px bottom clearance for floating dock */
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }
    .scroll-body::-webkit-scrollbar { width: 0; }

    /* AUTHENTIC APPLE LIQUID GLASS FLOATING PANELS */
    .glass-panel {
      position: relative;
      background: var(--glass-card);
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      border-radius: 28px;
      padding: 20px;
      border: 0.5px solid var(--glass-border);
      box-shadow: var(--glass-shadow), var(--glass-inner-sheen);
      transition: all 0.35s var(--spring-tactile);
      overflow: hidden;
    }
    .glass-panel:hover {
      transform: translateY(-2px);
      background: var(--glass-elevated);
      border-color: #FFFFFF;
      box-shadow: 0 24px 54px -12px rgba(15, 23, 42, 0.12), var(--glass-inner-sheen);
    }
    /* Sunlight Specular Refraction Sheen */
    .glass-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 45%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.1) 60%, transparent 100%);
      pointer-events: none;
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
    }

    /* SCREEN ANIMATION WRAPPER (Mac OS Window Minimizing / Scaling Physics) */
    .view-content {
      animation: macosWindowIn 0.35s var(--macos-zoom);
    }
    @keyframes macosWindowIn {
      0% { opacity: 0; transform: scale(0.96) translateY(10px); filter: blur(4px); }
      100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
    }

    /* TYPOGRAPHY STANDARDS (Apple Clean Human Style) */
    .view-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text-headline);
      letter-spacing: -0.4px;
      margin-bottom: 2px;
    }
    .view-caption {
      font-size: 12px;
      color: var(--text-caption);
      line-height: 1.4;
    }

    /* HIGH IMPACT METRIC ROW */
    .hero-stat-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 10px 0 14px;
    }
    .hero-stat-large {
      font-size: 32px;
      font-weight: 800;
      color: var(--text-headline);
      letter-spacing: -1px;
      font-family: 'JetBrains Mono', monospace;
    }
    .hero-stat-tag {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      letter-spacing: 0.3px;
    }
    .tag-emerald {
      background: var(--nature-mint);
      color: var(--nature-emerald);
      border: 0.5px solid rgba(16, 185, 129, 0.3);
    }
    .tag-crimson {
      background: #FEE2E2;
      color: var(--crimson-emergency);
      border: 0.5px solid rgba(239, 68, 68, 0.3);
    }

    /* TACTILE BOUNCY SPRING BUTTONS (Apple Damped Harmonic Physics) */
    .spring-tactile-btn {
      position: relative;
      background: linear-gradient(180deg, #10B981 0%, #059669 100%);
      color: #FFFFFF;
      border: none;
      padding: 15px 22px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 
        0 10px 25px -4px rgba(16, 185, 129, 0.45),
        inset 0 1px 2px rgba(255, 255, 255, 0.4);
      transition: all 0.25s var(--spring-tactile);
      user-select: none;
    }
    .spring-tactile-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 14px 32px -4px rgba(16, 185, 129, 0.6);
    }
    .spring-tactile-btn:active {
      transform: translateY(2px) scale(0.95); /* Rubber-band snap */
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    /* LIQUID MORPHING SLIDER (Light Nature) */
    .slider-container {
      margin: 14px 0 6px;
      position: relative;
    }
    .slider-sunlit-track {
      width: 100%;
      height: 12px;
      background: rgba(226, 232, 240, 0.7);
      border-radius: 999px;
      position: relative;
      overflow: hidden;
      border: 0.5px solid rgba(255, 255, 255, 0.9);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.06);
    }
    .slider-fluid-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      background: linear-gradient(90deg, #059669 0%, #10B981 100%);
      border-radius: 999px;
      box-shadow: 0 0 14px var(--nature-glow);
      transition: width 0.08s linear;
    }
    .slider-input-overlay {
      position: absolute;
      top: -6px; left: 0;
      width: 100%;
      height: 24px;
      opacity: 0;
      cursor: pointer;
      z-index: 10;
    }
    .slider-lens-thumb {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 24px;
      height: 24px;
      background: #FFFFFF;
      border-radius: 50%;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.18), 0 0 16px var(--nature-leaf);
      pointer-events: none;
      transition: left 0.08s linear, transform 0.2s var(--spring-tactile);
      border: 1px solid rgba(255, 255, 255, 0.9);
    }
    .slider-lens-thumb.dragging {
      transform: translate(-50%, -50%) scale(1.3);
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.25), 0 0 24px var(--nature-leaf);
    }

    /* ============================================================
       MAC OS / IOS FLOATING LIQUID GLASS CAPSULE DOCK
       ============================================================ */
    .floating-mac-dock {
      position: absolute;
      bottom: 18px;
      left: 20px;
      right: 20px;
      height: 64px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(36px) saturate(200%);
      -webkit-backdrop-filter: blur(36px) saturate(200%);
      border-radius: 32px;
      border: 0.5px solid rgba(255, 255, 255, 0.95);
      box-shadow: 
        0 18px 40px -8px rgba(15, 23, 42, 0.15),
        inset 0 1.5px 2px rgba(255, 255, 255, 1);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 8px;
      z-index: 40;
    }
    /* Gliding Liquid Refractive Bubble Lens */
    .dock-glide-bubble {
      position: absolute;
      height: 48px;
      width: 104px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.95) 0%, rgba(240, 253, 244, 0.9) 100%);
      border-radius: 24px;
      box-shadow: 
        0 8px 20px rgba(16, 185, 129, 0.15),
        0 1px 3px rgba(0, 0, 0, 0.05),
        inset 0 1px 1px #FFF;
      border: 0.5px solid rgba(255, 255, 255, 1);
      top: 8px;
      left: 12px;
      pointer-events: none;
      transition: transform 0.4s var(--spring-tactile);
      z-index: 1;
    }
    .dock-tab {
      position: relative;
      z-index: 2;
      background: none;
      border: none;
      flex: 1;
      height: 100%;
      color: var(--text-caption);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      transition: all 0.25s var(--spring-tactile);
    }
    .dock-tab.active {
      color: var(--nature-emerald);
      transform: scale(1.08); /* Mac OS Dock Magnification */
    }
    .dock-icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
      transition: transform 0.25s var(--spring-tactile);
    }
    .dock-tab.active .dock-icon {
      transform: translateY(-1px);
    }

    /* SCREEN 2: V2V P2P LIQUID DIALS (Light Nature) */
    .v2v-nature-stage {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 6px;
    }
    .car-orb {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 105px;
    }
    .orb-ring {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      box-shadow: 0 10px 24px rgba(16, 185, 129, 0.12);
      position: relative;
    }
    .orb-center {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 800;
      color: var(--text-headline);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }
    .orb-model { font-size: 12px; font-weight: 800; color: var(--text-headline); }
    .orb-sub { font-size: 10px; color: var(--text-caption); margin-top: 2px; }

    /* Animated Nature Sunlit Energy Beam */
    .beam-sunlit-conduit {
      flex: 1;
      height: 6px;
      background: rgba(226, 232, 240, 0.6);
      border-radius: 999px;
      margin: 0 10px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
    }
    .beam-stream {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 50%;
      background: linear-gradient(90deg, transparent, #10B981, transparent);
      box-shadow: 0 0 12px #10B981;
      animation: streamFlow 1.1s linear infinite;
    }
    @keyframes streamFlow {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    /* SCREEN 3: RADAR MAP CANVAS (Light Nature) */
    .map-sunlit-box {
      height: 250px;
      background: linear-gradient(180deg, #F0FDF4 0%, #E0F2FE 100%);
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      border: 0.5px solid var(--glass-border);
      box-shadow: inset 0 0 30px rgba(16, 185, 129, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .radar-sun-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .user-sun-blip {
      position: relative;
      z-index: 20;
      width: 22px;
      height: 22px;
      background: #FFFFFF;
      border: 3.5px solid var(--nature-emerald);
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(5, 150, 105, 0.4);
    }
    .station-marker-pin {
      position: absolute;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 25;
      transition: transform 0.25s var(--spring-tactile);
    }
    .station-marker-pin:hover {
      transform: scale(1.22);
    }
    .marker-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #FFF;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .marker-text {
      font-size: 9px;
      font-weight: 800;
      color: var(--text-headline);
      background: rgba(255, 255, 255, 0.95);
      padding: 2px 6px;
      border-radius: 6px;
      margin-top: 2px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      white-space: nowrap;
      border: 0.5px solid rgba(255, 255, 255, 1);
    }

    /* 15-Minute Slot Chips */
    .slot-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 12px 0 16px;
    }
    .slot-card {
      background: rgba(255, 255, 255, 0.7);
      border: 0.5px solid rgba(255, 255, 255, 1);
      border-radius: 16px;
      padding: 10px 4px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      transition: all 0.25s var(--spring-tactile);
    }
    .slot-card.selected {
      background: linear-gradient(180deg, #10B981 0%, #059669 100%);
      color: #FFF;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
      transform: scale(1.04);
    }
    .slot-card .time { font-size: 13px; font-weight: 800; }
    .slot-card .sub { font-size: 9px; opacity: 0.8; margin-top: 2px; }

    /* APPLE WALLET DIGITAL PASS MODAL (Mac OS Zoom in) */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      animation: modalZoomIn 0.3s var(--macos-zoom);
    }
    @keyframes modalZoomIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }
    .pass-ticket {
      width: 100%;
      background: #FFFFFF;
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 1);
      box-shadow: 0 35px 70px -15px rgba(15, 23, 42, 0.25);
      padding: 24px;
      position: relative;
    }
  </style>
</head>
<body>

  <div class="sunbeam-aura"></div>

  <div class="studio-header">
    <div class="status-capsule">
      <div class="pulsing-emerald"></div>
      <span>APPLE LIQUID GLASS • LIGHT EV NATURE THEME</span>
    </div>
  </div>

  <!-- IPHONE 16 PRO PEARL LIQUID GLASS FRAME -->
  <div class="iphone-shell">
    <div class="screen-surface">
      
      <!-- DYNAMIC ISLAND -->
      <div class="dynamic-capsule" id="dynamicCapsule">
        <div class="capsule-content">
          <div class="pulsing-emerald" style="width: 5px; height: 5px;"></div>
          <span id="capsuleText">GRID: 98% (STABLE)</span>
        </div>

  <script>
    const API_BASE = "http://127.0.0.1:8000";

    // Reactive State with Optimistic 0ms Latency Updates

      userBattery: 28,

      donorModel: "Hyundai Ioniq 5 (72.6 kWh)",

      substationStatus: "Normal & Stable",

        { id: 1, name: "Indiranagar 100ft EV Hub", address: "100 Feet Rd, HAL 2nd Stage", chargers_total: 8, chargers_available: 3, power_kw: 120, grid_load: 0.65, predicted_wait_min: 8.5, price_per_kwh: 15.5, distance_km: 2.4 },
        { id: 2, name: "Koramangala Nexus FastCharge", address: "Hosur Rd, 7th Block", chargers_total: 6, chargers_available: 4, power_kw: 60, grid_load: 0.45, predicted_wait_min: 4.2, price_per_kwh: 14.0, distance_km: 3.8 },

    };

    function init() {
      state.selectedStation = state.stations[0];
      updateClock();
      setInterval(updateClock, 1000);
      renderView();
    }

    function updateClock() {
      const now = new Date();
      const hrs = now.getHours().toString().padStart(2, '0');
      const mins = now.getMinutes().toString().padStart(2, '0');
      document.getElementById('timeClock').innerText = `${hrs}:${mins}`;
    }

    function toggleDemoSeed() {
      state.demoMode = !state.demoMode;
      const btn = document.getElementById('demoPillBtn');
      if (state.demoMode) {
        state.userBattery = 28;
        state.donorBattery = 92;
        state.donorDistanceKm = 0.4;
        btn.innerHTML = `<span>⚡ DEMO MODE</span>`;
        btn.style.borderColor = 'var(--nature-leaf)';
        triggerIslandNote("DEMO SEED: 92% ➔ 28% @ 0.4KM");
      } else {
        btn.innerHTML = `<span>LIVE MODE</span>`;
        btn.style.borderColor = '#CBD5E1';
        triggerIslandNote("LIVE HARDWARE SYNC");
      }
      renderView();
    }

    function triggerIslandNote(text) {
      const capsule = document.getElementById('dynamicCapsule');
      const label = document.getElementById('capsuleText');
      label.innerText = text;
      capsule.classList.add('expanded');
      setTimeout(() => capsule.classList.remove('expanded'), 2500);
    }

    function switchDockTab(idx) {
      state.activeTab = idx;
      
      // Mac OS Gliding Bubble Animation with spring overshoot
      const bubble = document.getElementById('dockBubble');
      const tabWidth = (365 - 16) / 3;
      bubble.style.transform = `translateX(${idx * tabWidth}px)`;

      document.querySelectorAll('.dock-tab').forEach((tab, i) => {
        if (i === idx) tab.classList.add('active');
        else tab.classList.remove('active');
      });

      renderView();
    }

    function isUrgent() {
      return state.vehicleType.toLowerCase() === "ambulance" || state.userBattery <= 10;
    }

    /* -------------------------------------------------------------
       SCREEN RENDERERS (Clean, uncluttered, luxury human standard)
       ------------------------------------------------------------- */
    function renderView() {
      const body = document.getElementById('scrollContainer');
      document.getElementById('vehicleSubtext').innerText = `${state.vehicleModel.toUpperCase()} (${state.userBattery}%)`;

      if (state.activeTab === 0) renderScreen1(body);
      else if (state.activeTab === 1) renderScreen2(body);
      else if (state.activeTab === 2) renderScreen3(body);
    }

    /* SCREEN 1: LIVE AI GRID & CHARGER MATCHER */
    function renderScreen1(body) {
      const urgent = isUrgent();
      const topMatch = state.stations[1]; // Koramangala optimal

      body.innerHTML = `
        <div class="view-content">
          <!-- HEADER -->
          <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px;">

              <div class="view-title">Grid & Charger Matcher</div>

            </div>

              ${urgent ? '🚨 LEAPFROG ACTIVE' : 'OPTIMAL GRID'}
            </span>
          </div>

          <!-- HIGH-IMPACT STAT 1: SUBSTATION GRID HEALTH -->

            <div style="font-size: 11px; font-weight: 700; color: var(--text-caption); text-transform: uppercase; letter-spacing: 0.5px;">

            ${urgent ? `

                </span>
                <div style="font-size: 18px; font-weight: 800; color: var(--text-headline); margin-top: 6px;">${topMatch.name}</div>
                <div style="font-size: 12px; color: var(--text-caption);">${topMatch.address}</div>
              </div>
              <div style="font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 800; color: var(--nature-emerald); background: var(--nature-mint); padding: 4px 10px; border-radius: 10px;">
                ${urgent ? '99/100' : '94/100'}
              </div>
            </div>

            <!-- Clean High-Impact Stats Row -->
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0; background: #FFFFFF; padding: 12px; border-radius: 18px; border: 0.5px solid #E2E8F0;">
              <div>
                <span style="font-size: 9px; color: var(--text-caption); display: block;">DISTANCE</span>

              </div>
              <div>
                <span style="font-size: 9px; color: var(--text-caption); display: block;">XGBOOST WAIT</span>
                <strong style="font-size: 14px; color: var(--nature-emerald); font-family: 'JetBrains Mono', monospace;">~${urgent ? '0.0' : topMatch.predicted_wait_min} min</strong>

              <div>
                <span style="font-size: 9px; color: var(--text-caption); display: block;">DC CHARGE</span>

    function updateBatterySlider(val) {
      state.userBattery = parseInt(val);

    /* SCREEN 2: V2V P2P ENERGY SHARING HUB */
    function renderScreen2(body) {
      const kwh = state.v2vTransferKwh;
      const donorSoc = Math.max(15, (state.donorBattery - (kwh / 72.6 * 100)).toFixed(0));
      const receiverSoc = Math.min(100, (state.userBattery + (kwh / 40.5 * 100)).toFixed(0));
      const durationMin = ((kwh / 22.0) * 60).toFixed(0);

        <div class="view-content">

                </div>
                <div class="orb-model">Hyundai Ioniq 5</div>

              <!-- SUNLIT ENERGY BEAM -->

                <div class="orb-ring" style="background: conic-gradient(#10B981 ${receiverSoc}%, #E2E8F0 0);">
                  <div class="orb-center" style="color: var(--nature-emerald);">${receiverSoc}%</div>
                </div>
                <div class="orb-model">Tata Nexon EV</div>
                <div class="orb-sub">Your Vehicle</div>
              </div>
            </div>

            <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--text-sub); border-top: 1px solid #F1F5F9; padding-top: 12px; margin-top: 6px;">
              <span>Proximity: <strong style="color: var(--text-headline);">${state.donorDistanceKm} km away</strong></span>
              <span>Rate: <strong style="color: var(--nature-emerald);">22 kW Mobile DC</strong></span>

          </div>

          <!-- KWH SLIDER PANEL -->
          <div class="glass-panel">
            <div style="display: flex; justify-content: space-between; align-items: baseline;">
              <span style="font-size: 14px; font-weight: 800;">Transfer Energy</span>
              <span style="font-size: 24px; font-weight: 800; color: var(--nature-emerald); font-family: 'JetBrains Mono', monospace;" id="kwhLabel">
                ${kwh} kWh
              </span>
            </div>

            <div class="slider-container">
              <div class="slider-sunlit-track">
                <div class="slider-fluid-fill" id="v2vFill" style="width: ${(kwh / 25) * 100}%;"></div>

                <strong style="font-size: 15px; color: var(--nature-emerald); font-family: 'JetBrains Mono', monospace;">+${ecoCredits} Pts</strong>
              </div>
            </div>

            <button class="spring-tactile-btn" style="width: 100%;" onclick="executeV2VTransfer()">
              EXECUTE V2V POWER TRANSFER
            </button>
          </div>
        </div>
      `;
    }

    function updateV2VSlider(val) {
      state.v2vTransferKwh = parseInt(val);
      const pct = (val / 25) * 100;
      document.getElementById('kwhLabel').innerText = `${val} kWh`;
      document.getElementById('v2vFill').style.width = pct + '%';
      document.getElementById('v2vThumb').style.left = pct + '%';

      // Live reactive dials
      const kwh = state.v2vTransferKwh;
      const donorSoc = Math.max(15, (state.donorBattery - (kwh / 72.6 * 100)).toFixed(0));
      const receiverSoc = Math.min(100, (state.userBattery + (kwh / 40.5 * 100)).toFixed(0));
      document.querySelectorAll('.orb-center')[0].innerText = donorSoc + '%';
      document.querySelectorAll('.orb-center')[1].innerText = receiverSoc + '%';
    }

    function executeV2VTransfer() {
      triggerIslandNote(`V2V TRANSFERRING: ${state.v2vTransferKwh} kWh`);

      // Optimistic instant state update
      const added = Math.round((state.v2vTransferKwh / 40.5) * 100);
      state.userBattery = Math.min(100, state.userBattery + added);
      state.donorBattery = Math.max(20, state.donorBattery - Math.round((state.v2vTransferKwh / 72.6) * 100));

      // Background API integration
      fetch(`${API_BASE}/v2v/transfer`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          donor_user_id: "peer_ioniq_01",
          receiver_user_id: "user_live_01",
          kwh_amount: state.v2vTransferKwh,
          transfer_power_kw: 22.0
        })
      }).catch(() => {});

      setTimeout(() => {
        triggerIslandNote(`V2V SUCCESS (+${state.v2vTransferKwh * 15} PTS)`);
        renderView();
      }, 1000);
    }

            </div>
            <div class="station-marker-pin" style="bottom: 45px; right: 65px;" onclick="pickStation(2)">
              <div class="marker-dot" style="background: var(--nature-emerald);"></div>
              <div class="marker-text">Koramangala (4)</div>
            </div>
            <div class="station-marker-pin" style="top: 65px; left: 45px;" onclick="pickStation(3)">
              <div class="marker-dot" style="background: var(--crimson-emergency);"></div>
              <div class="marker-text">MG Road (0)</div>
            </div>
            <div class="station-marker-pin" style="bottom: 50px; left: 55px;" onclick="pickStation(4)">
              <div class="marker-dot" style="background: var(--nature-emerald);"></div>
              <div class="marker-text">Whitefield (5)</div>
            </div>
          </div>

          <!-- RESERVATION CARD -->
          <div class="glass-panel" style="margin-top: 14px;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
              <div>
                <div style="font-size: 16px; font-weight: 800; color: var(--text-headline);">${state.selectedStation.name}</div>
                <div style="font-size: 11px; color: var(--text-caption);">${state.selectedStation.address}</div>
              </div>
              <span class="hero-stat-tag tag-emerald">${state.selectedStation.chargers_available} Free Bays</span>
            </div>

            <div style="margin-top: 14px;">
              <span style="font-size: 10px; font-weight: 700; color: var(--text-caption); text-transform: uppercase; letter-spacing: 0.5px;">
                Select 15-Minute Slot
              </span>

              <div class="slot-row">
                <div class="slot-card selected" onclick="selectSlot(this, '18:45')">
                  <div class="time">18:45</div>
                  <div class="sub">Ready</div>
                </div>
                <div class="slot-card" onclick="selectSlot(this, '19:00')">
                  <div class="time">19:00</div>
                  <div class="sub">+15m</div>
                </div>
                <div class="slot-card" onclick="selectSlot(this, '19:15')">
                  <div class="time">19:15</div>
                  <div class="sub">+30m</div>
                </div>
                <div class="slot-card" onclick="selectSlot(this, '19:30')">
                  <div class="time">19:30</div>
                  <div class="sub">+45m</div>
                </div>
              </div>
            </div>

            <button class="spring-tactile-btn" style="width: 100%;" onclick="openTicketModal()">
              CONFIRM & GENERATE DIGITAL PASS
            </button>
          </div>
        </div>
      `;
    }

    function pickStation(id) {
      state.selectedStation = state.stations.find(s => s.id === id) || state.stations[0];
      renderView();
    }

    function selectSlot(el, slot) {
      document.querySelectorAll('.slot-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      state.selectedSlot = slot;
    }

    function openReservationModal(id) {
      pickStation(id);
      openTicketModal();
    }

    function openTicketModal() {
      const urgent = isUrgent();
      const st = state.selectedStation;

      document.getElementById('ticketStationName').innerText = st.name;
      document.getElementById('ticketStationAddress').innerText = st.address;
      document.getElementById('ticketBayLabel').innerText = urgent ? "Bay #1 (Emergency 120 kW)" : "Bay #2 (60 kW Fast)";
      document.getElementById('ticketPriorityLabel').innerText = urgent ? "🚨 URGENT LEAPFROG" : "STANDARD CONFIRMED";
      document.getElementById('ticketPriorityLabel').style.color = urgent ? "var(--crimson-emergency)" : "var(--nature-emerald)";
      document.getElementById('ticketIdLabel').innerText = "GF-" + Math.floor(1000 + Math.random() * 9000);

      document.getElementById('passBackdrop').style.display = 'flex';
      triggerIslandNote("PASS READY: " + st.name.substring(0, 14));
    }

    function closeTicketModal() {
      document.getElementById('passBackdrop').style.display = 'none';
      switchDockTab(0);
    }

    // Launch
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
