<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GridFlow AI — Apple Liquid Glass (EV Nature Edition)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Apple Light Nature & Sky Blue EV Palette */
      --sky-electric: #00A3FF;
      --sky-vibrant: #0284C7;
      --sky-soft: #38BDF8;
      --sky-mist: #BAE6FD;
      --sky-aura: #E0F2FE;
      
      --nature-emerald: #059669;
      --nature-leaf: #10B981;
      --nature-mint: #D1FAE5;
      --nature-glow: rgba(16, 185, 129, 0.3);
      
      /* Pure Pearl Glass & Crystal Refraction */
      --glass-body: rgba(255, 255, 255, 0.48);
      --glass-card: rgba(255, 255, 255, 0.54);
      --glass-elevated: rgba(255, 255, 255, 0.72);
      --glass-border: rgba(255, 255, 255, 0.88);
      --glass-border-subtle: rgba(255, 255, 255, 0.65);
      --glass-inner-sheen: inset 0 1.5px 2px rgba(255, 255, 255, 0.95), inset 0 -1px 1px rgba(0, 0, 0, 0.03);
      --glass-shadow: 0 18px 40px -10px rgba(15, 23, 42, 0.12), 0 2px 6px rgba(0, 0, 0, 0.04);
      
      /* Typography Colors (High Human Legibility) */
      --text-headline: #0F172A;
      --text-sub: #334155;
      --text-caption: #64748B;
      --text-emerald: #047857;
      --text-sky: #0369A1;
      
      /* Status */
      --amber-busy: #D97706;
      --crimson-emergency: #DC2626;

      /* Extreme Bouncy Spring Physics (Damping ~0.45, Stiffness ~400) */
      --spring-bouncy: cubic-bezier(0.175, 1.45, 0.32, 1.35);
      --spring-dock: cubic-bezier(0.175, 1.45, 0.32, 1.25);
      --macos-zoom: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }

    body {
      min-height: 100vh;
      /* Soft morning daylight presentation studio environment with blurred nature backdrop */
      background: 
        radial-gradient(ellipse at 50% 20%, rgba(186, 230, 253, 0.4) 0%, rgba(224, 242, 254, 0.25) 50%, rgba(241, 245, 249, 0.95) 100%),
        url('assets/ev_nature_backdrop.jpg') center/cover no-repeat fixed;
      position: relative;
      color: var(--text-headline);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Ambient Glass Blur Backdrop Overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(241, 245, 249, 0.82);
      backdrop-filter: blur(55px);
      -webkit-backdrop-filter: blur(55px);
      z-index: 0;
    }

    /* Header Bar */
    .studio-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      z-index: 10;
    }
    .status-capsule {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(24px);
      border: 0.8px solid rgba(255, 255, 255, 1);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      color: var(--sky-vibrant);
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.4px;
    }
    .pulsing-emerald {
      width: 7px;
      height: 7px;
      background: var(--nature-leaf);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--nature-leaf);
      animation: pulseBreath 2s infinite ease-in-out;
    }
    @keyframes pulseBreath {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.35); opacity: 1; box-shadow: 0 0 16px var(--nature-leaf); }
    }

    /* ============================================================
       IPHONE 16 PRO PEARL LIQUID GLASS FRAME
       ============================================================ */
    .iphone-shell {
      position: relative;
      width: 405px;
      height: 844px;
      background: #FFFFFF;
      border-radius: 54px;
      padding: 10px;
      box-shadow: 
        0 40px 90px -20px rgba(15, 23, 42, 0.28),
        0 0 0 1px rgba(255, 255, 255, 1),
        0 0 45px rgba(0, 163, 255, 0.12),
        inset 0 1px 2px rgba(255, 255, 255, 0.95);
      z-index: 10;
      display: flex;
      flex-direction: column;
    }
    
    /* PHONE SCREEN SURFACE (Rich EV Nature & Sky Blue Atmospheric Backdrop) */
    .screen-surface {
      position: relative;
      flex: 1;
      background-image: 
        linear-gradient(180deg, 
          rgba(224, 242, 254, 0.32) 0%, 
          rgba(248, 250, 252, 0.42) 45%, 
          rgba(209, 250, 229, 0.36) 100%
        ),
        url('assets/ev_nature_backdrop.jpg');
      background-size: cover;
      background-position: center top;
      border-radius: 44px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.8);
    }

    /* CLEAN MINIMAL STATUS BAR (NO DYNAMIC ISLAND / NOTCH) */
    .status-row {
      height: 40px;
      padding: 12px 26px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-headline);
      z-index: 50;
    }
    .status-network {
      display: flex;
      gap: 6px;
      align-items: center;
      color: var(--text-headline);
    }
    .network-badge {
      font-size: 10px;
      font-weight: 800;
      color: var(--sky-vibrant);
    }

    /* App Nav Header */
    .app-header {
      padding: 10px 22px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
    }
    .brand-group h2 {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-headline);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-group p {
      font-size: 10px;
      color: var(--sky-vibrant);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    /* DEMO MODE SWITCH PILL */
    .demo-pill-btn {
      background: rgba(255, 255, 255, 0.92);
      border: 0.8px solid var(--sky-soft);
      padding: 5px 12px;
      border-radius: 999px;
      color: var(--sky-vibrant);
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 14px rgba(0, 163, 255, 0.18);
      transition: all 0.4s var(--spring-bouncy);
    }
    .demo-pill-btn:hover {
      transform: scale(1.08);
      background: #FFFFFF;
      box-shadow: 0 6px 20px rgba(0, 163, 255, 0.3);
    }
    .demo-pill-btn:active {
      transform: scale(0.88);
    }

    /* SCROLLABLE VIEWPORT */
    .scroll-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 6px 18px 88px; /* clearance for perfectly centered floating dock */
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    .scroll-body::-webkit-scrollbar { width: 0; }

    /* AUTHENTIC APPLE LIQUID GLASS FLOATING PANELS */
    .glass-panel {
      position: relative;
      background: var(--glass-card);
      backdrop-filter: blur(30px) saturate(210%);
      -webkit-backdrop-filter: blur(30px) saturate(210%);
      border-radius: 26px;
      padding: 18px;
      border: 0.8px solid var(--glass-border);
      box-shadow: var(--glass-shadow), var(--glass-inner-sheen);
      transition: transform 0.45s var(--spring-bouncy), box-shadow 0.3s ease;
      overflow: hidden;
    }
    .glass-panel:hover {
      transform: translateY(-2px) scale(1.01);
      background: var(--glass-elevated);
      border-color: #FFFFFF;
      box-shadow: 0 22px 50px -10px rgba(15, 23, 42, 0.16), var(--glass-inner-sheen);
    }
    /* Sunlight Specular Refraction Sheen */
    .glass-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 45%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.12) 60%, transparent 100%);
      pointer-events: none;
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
    }

    /* SCREEN ANIMATION WRAPPER */
    .view-content {
      animation: macosWindowIn 0.35s var(--macos-zoom);
    }
    @keyframes macosWindowIn {
      0% { opacity: 0; transform: scale(0.95) translateY(10px); filter: blur(5px); }
      100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
    }

    /* TYPOGRAPHY STANDARDS (Apple HIG Clean Minimal Standard) */
    .view-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text-headline);
      letter-spacing: -0.4px;
      margin-bottom: 2px;
    }
    .view-caption {
      font-size: 12px;
      color: var(--text-caption);
      line-height: 1.35;
    }

    /* HIGH IMPACT METRIC ROW */
    .hero-stat-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 8px 0 12px;
    }
    .hero-stat-large {
      font-size: 32px;
      font-weight: 800;
      color: var(--text-headline);
      letter-spacing: -1px;
      font-family: 'JetBrains Mono', monospace;
    }
    .hero-stat-tag {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      letter-spacing: 0.3px;
    }
    .tag-sky {
      background: var(--sky-aura);
      color: var(--sky-vibrant);
      border: 0.5px solid rgba(2, 132, 199, 0.3);
    }
    .tag-emerald {
      background: var(--nature-mint);
      color: var(--nature-emerald);
      border: 0.5px solid rgba(16, 185, 129, 0.3);
    }
    .tag-crimson {
      background: #FEE2E2;
      color: var(--crimson-emergency);
      border: 0.5px solid rgba(239, 68, 68, 0.3);
    }

    /* EXTREME BOUNCY SPRING BUTTONS (Apple Damped Harmonic Physics: Damping ~0.45, Stiffness ~400) */
    .spring-tactile-btn {
      position: relative;
      background: linear-gradient(135deg, #00A3FF 0%, #0284C7 45%, #10B981 100%);
      color: #FFFFFF;
      border: none;
      padding: 14px 20px;
      border-radius: 18px;
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: -0.2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 
        0 12px 28px -4px rgba(0, 163, 255, 0.45),
        0 0 16px rgba(16, 185, 129, 0.25),
        inset 0 1.5px 2px rgba(255, 255, 255, 0.6);
      transition: transform 0.45s var(--spring-bouncy), box-shadow 0.3s ease;
      user-select: none;
    }
    .spring-tactile-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 16px 36px -4px rgba(0, 163, 255, 0.6), 0 0 22px rgba(16, 185, 129, 0.35);
    }
    .spring-tactile-btn:active {
      transform: translateY(2px) scale(0.88); /* Deep tactile snap */
      box-shadow: 0 4px 12px rgba(0, 163, 255, 0.3);
    }

    /* RUBBER-BAND SNAP ANIMATION ON CLICK */
    @keyframes extremeRubberBand {
      0% { transform: scale(1); }
      22% { transform: scale(0.86); }
      52% { transform: scale(1.18); }
      72% { transform: scale(0.96); }
      86% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
    .rubberband-trigger {
      animation: extremeRubberBand 0.42s var(--spring-bouncy) forwards;
    }

    /* LIQUID MORPHING SLIDER */
    .slider-container {
      margin: 12px 0 4px;
      position: relative;
    }
    .slider-sunlit-track {
      width: 100%;
      height: 12px;
      background: rgba(226, 232, 240, 0.7);
      border-radius: 999px;
      position: relative;
      overflow: hidden;
      border: 0.5px solid rgba(255, 255, 255, 0.9);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.06);
    }
    .slider-fluid-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      background: linear-gradient(90deg, #0284C7 0%, #00A3FF 60%, #10B981 100%);
      border-radius: 999px;
      box-shadow: 0 0 14px rgba(0, 163, 255, 0.4);
      transition: width 0.08s linear;
    }
    .slider-input-overlay {
      position: absolute;
      top: -6px; left: 0;
      width: 100%;
      height: 24px;
      opacity: 0;
      cursor: pointer;
      z-index: 10;
    }
    .slider-lens-thumb {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 26px;
      height: 26px;
      background: #FFFFFF;
      border-radius: 50%;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.18), 0 0 18px var(--sky-electric);
      pointer-events: none;
      transition: left 0.08s linear, transform 0.3s var(--spring-bouncy);
      border: 1px solid rgba(255, 255, 255, 0.95);
    }
    .slider-lens-thumb.dragging {
      transform: translate(-50%, -50%) scale(1.35);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.25), 0 0 28px var(--sky-electric);
    }

    /* ============================================================
       MAC OS / IOS FLOATING LIQUID GLASS CAPSULE DOCK
       (Strictly Center-Aligned & Mathematically Snapped Capsule)
       ============================================================ */
    .floating-mac-dock {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 334px;
      height: 58px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(36px) saturate(220%);
      -webkit-backdrop-filter: blur(36px) saturate(220%);
      border-radius: 29px;
      border: 0.8px solid rgba(255, 255, 255, 0.95);
      box-shadow: 
        0 20px 44px -8px rgba(15, 23, 42, 0.18),
        inset 0 1.5px 2px rgba(255, 255, 255, 1),
        inset 0 -1px 1px rgba(0, 0, 0, 0.04);
      display: flex;
      align-items: center;
      padding: 5px;
      z-index: 40;
    }
    /* Gliding Liquid Refractive Bubble Lens (108px width matches 108px tabs exactly) */
    .dock-glide-bubble {
      position: absolute;
      height: 48px;
      width: 108px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98) 0%, rgba(240, 249, 255, 0.92) 100%);
      border-radius: 24px;
      border: 0.8px solid rgba(255, 255, 255, 1);
      box-shadow: 
        0 10px 24px rgba(0, 163, 255, 0.28),
        inset 2.5px 0 5px rgba(0, 163, 255, 0.5),    /* Refractive Cyan/Blue rim */
        inset -2.5px 0 5px rgba(16, 185, 129, 0.5),  /* Refractive Emerald rim */
        inset 0 2px 4px rgba(255, 255, 255, 1),
        inset 0 -2px 4px rgba(251, 191, 36, 0.25);  /* Refractive Amber rim */
      top: 5px;
      left: 5px;
      pointer-events: none;
      transition: transform 0.42s var(--spring-dock);
      z-index: 1;
    }
    .dock-tab {
      position: relative;
      z-index: 2;
      background: none;
      border: none;
      width: 108px;
      height: 48px;
      color: var(--text-caption);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      transition: transform 0.4s var(--spring-bouncy), color 0.25s ease;
      user-select: none;
    }
    .dock-tab.active {
      color: var(--sky-vibrant);
      transform: scale(1.16);
      text-shadow: 0 0 14px rgba(0, 163, 255, 0.45);
    }
    .dock-icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
      transition: transform 0.4s var(--spring-bouncy);
    }
    .dock-tab.active .dock-icon {
      transform: translateY(-1px);
    }

    /* SCREEN 2: V2V P2P LIQUID DIALS */
    .v2v-nature-stage {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 4px;
    }
    .car-orb {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 105px;
    }
    .orb-ring {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      box-shadow: 0 10px 24px rgba(0, 163, 255, 0.15);
      position: relative;
    }
    .orb-center {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 800;
      color: var(--text-headline);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }
    .orb-model { font-size: 12px; font-weight: 800; color: var(--text-headline); }
    .orb-sub { font-size: 10px; color: var(--text-caption); margin-top: 2px; }

    /* Animated Nature Energy Beam */
    .beam-sunlit-conduit {
      flex: 1;
      height: 6px;
      background: rgba(226, 232, 240, 0.6);
      border-radius: 999px;
      margin: 0 10px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
    }
    .beam-stream {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 50%;
      background: linear-gradient(90deg, transparent, #00A3FF, #10B981, transparent);
      box-shadow: 0 0 14px #00A3FF;
      animation: streamFlow 1.1s linear infinite;
    }
    @keyframes streamFlow {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    /* ============================================================
       SCREEN 3: REALISTIC VECTOR MINI-MAP COMPONENT
       ============================================================ */
    .map-vector-wrapper {
      position: relative;
      height: 255px;
      background: #EBF4FC;
      border-radius: 24px;
      overflow: hidden;
      border: 0.8px solid var(--glass-border);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08), inset 0 0 20px rgba(0, 163, 255, 0.06);
    }
    .map-vector-svg {
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    /* User GPS Location Puck */
    .user-gps-puck {
      position: absolute;
      transform: translate(-50%, -50%);
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }
    .gps-pulse {
      position: absolute;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(0, 163, 255, 0.22);
      animation: gpsPulseAnim 2.2s infinite ease-out;
    }
    .gps-dot {
      width: 14px;
      height: 14px;
      background: var(--sky-electric);
      border: 2.5px solid #FFFFFF;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0, 163, 255, 0.6);
      position: relative;
      z-index: 2;
    }
    .gps-badge {
      background: rgba(15, 23, 42, 0.85);
      color: #FFFFFF;
      font-size: 8.5px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      margin-top: 3px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      white-space: nowrap;
    }
    @keyframes gpsPulseAnim {
      0% { transform: scale(0.6); opacity: 0.9; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    /* Realistic Interactive Station Map Pins */
    .map-station-pill {
      position: absolute;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(14px);
      border: 0.8px solid rgba(255, 255, 255, 1);
      border-radius: 12px;
      padding: 6px 10px;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.12);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      z-index: 30;
      transition: all 0.35s var(--spring-bouncy);
      user-select: none;
    }
    .map-station-pill:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
    }
    .map-station-pill.active {
      border-color: var(--sky-electric);
      background: #FFFFFF;
      box-shadow: 0 8px 22px rgba(0, 163, 255, 0.35);
      transform: scale(1.06);
    }
    .pill-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .pill-dot.emerald {
      background: var(--nature-leaf);
      box-shadow: 0 0 8px var(--nature-leaf);
    }
    .pill-dot.crimson {
      background: var(--crimson-emergency);
      box-shadow: 0 0 8px var(--crimson-emergency);
    }
    .pill-content {
      display: flex;
      flex-direction: column;
    }
    .pill-title {
      font-size: 10px;
      font-weight: 800;
      color: var(--text-headline);
      white-space: nowrap;
    }
    .pill-meta {
      font-size: 8.5px;
      color: var(--text-caption);
      font-weight: 700;
      white-space: nowrap;
    }

    /* 15-Minute Slot Chips */
    .slot-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 10px 0 14px;
    }
    .slot-card {
      background: rgba(255, 255, 255, 0.72);
      border: 0.8px solid rgba(255, 255, 255, 1);
      border-radius: 14px;
      padding: 9px 4px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);

      updateClock();

      fetch(`${API_BASE}/stations`)
        .then(res => res.json())
        .then(data => {
          if (data && data.stations && data.stations.length > 0) {
            state.stations = data.stations.slice(0, 4).map((s, idx) => ({
              ...s,
              distance_km: (2.4 + idx * 1.5).toFixed(1),

      const now = new Date();
      const hrs = now.getHours().toString().padStart(2, '0');
      const mins = now.getMinutes().toString().padStart(2, '0');
      document.getElementById('timeClock').innerText = `${hrs}:${mins}`;

      state.demoMode = !state.demoMode;

      btn.classList.add('rubberband-trigger');

        state.donorBattery = 92;

        btn.style.borderColor = '#CBD5E1';
        btn.style.color = 'var(--text-caption)';
      }
      renderView();
    }

    function switchDockTab(idx) {
      state.activeTab = idx;
      
      // Pixel-perfect centering: 108px per tab
      const bubble = document.getElementById('dockBubble');
      bubble.style.transform = `translateX(${idx * 108}px)`;

      document.querySelectorAll('.dock-tab').forEach((tab, i) => {
        if (i === idx) {
          tab.classList.add('active');
          tab.classList.add('rubberband-trigger');
          setTimeout(() => tab.classList.remove('rubberband-trigger'), 450);
        } else {
          tab.classList.remove('active');
        }
      });

      renderView();
    }

    function isUrgent() {
      return state.vehicleType.toLowerCase() === "ambulance" || state.userBattery <= 10;

      else if (state.activeTab === 1) renderScreen2(body);
      else if (state.activeTab === 2) renderScreen3(body);
    }

      const receiverSoc = Math.min(100, (state.userBattery + (kwh / 40.5 * 100)).toFixed(0));
      document.querySelectorAll('.orb-center')[0].innerText = donorSoc + '%';
      document.querySelectorAll('.orb-center')[1].innerText = receiverSoc + '%';
    }

    function executeV2VTransfer() {
      const added = Math.round((state.v2vTransferKwh / 40.5) * 100);
      state.userBattery = Math.min(100, state.userBattery + added);
      state.donorBattery = Math.max(20, state.donorBattery - Math.round((state.v2vTransferKwh / 72.6) * 100));

      fetch(`${API_BASE}/v2v/transfer`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          donor_user_id: "peer_ioniq_01",
          receiver_user_id: "user_live_01",
          kwh_amount: state.v2vTransferKwh,
          transfer_power_kw: 22.0
        })
      }).catch(() => {});

      renderView();
    }

    function pickStation(id) {
      state.selectedStation = state.stations.find(s => s.id === id) || state.stations[0];
      renderView();
    }

    function selectSlot(el, slot) {
      document.querySelectorAll('.slot-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      el.classList.add('rubberband-trigger');
      setTimeout(() => el.classList.remove('rubberband-trigger'), 450);
      state.selectedSlot = slot;
    }

    function openReservationModal(id) {
      pickStation(id);
      openTicketModal();
    }

    function openTicketModal() {
      const urgent = isUrgent();
      const st = state.selectedStation;

      document.getElementById('ticketStationName').innerText = st.name;
      document.getElementById('ticketStationAddress').innerText = st.address;
      document.getElementById('ticketBayLabel').innerText = urgent ? "Bay #1 (Emergency 120 kW)" : "Bay #1 (60 kW DC)";
      document.getElementById('ticketPriorityLabel').innerText = urgent ? "PRIORITY CONFIRMED" : "CONFIRMED (15 MIN)";
      document.getElementById('ticketPriorityLabel').style.color = urgent ? "var(--crimson-emergency)" : "var(--sky-vibrant)";
      document.getElementById('ticketIdLabel').innerText = "GF-" + Math.floor(1000 + Math.random() * 9000);

      document.getElementById('passBackdrop').style.display = 'flex';
    }

    function closeTicketModal() {
      document.getElementById('passBackdrop').style.display = 'none';
      switchDockTab(0);
    }

    // Launch
    window.addEventListener('DOMContentLoaded', init);
